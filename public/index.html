<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-opMaps Deluxe</title>
    <link rel="stylesheet" href="css/tutorial.css">
    <style>
        /* ============================================
           CSS Variables & Base
           ============================================ */
        :root {
            --primary: #8b5cf6;
            --primary-dark: #7c3aed;
            --secondary: #ec4899;
            --bg-dark: #0f0f1a;
            --bg-card: #1a1a2e;
            --bg-hover: #252540;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-muted: rgba(255, 255, 255, 0.5);
            --border-color: rgba(255, 255, 255, 0.1);
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.3);
            --radius: 12px;
            --transition: all 0.2s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }

        /* ============================================
           App Layout
           ============================================ */
        .app-container {
            display: grid;
            grid-template-rows: auto 1fr;
            grid-template-columns: 280px 1fr 320px;
            height: 100vh;
        }

        /* ============================================
           Header / Toolbar
           ============================================ */
        .app-header {
            grid-column: 1 / -1;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            flex: 1;
            justify-content: center;
        }

        .toolbar-btn {
            padding: 10px 16px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toolbar-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
            border-color: var(--primary);
        }

        .toolbar-btn.primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            color: white;
        }

        .toolbar-btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .diagram-name-input {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 14px;
            color: var(--text-primary);
            font-size: 14px;
            width: 200px;
        }

        .diagram-name-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* ============================================
           Sidebar - Left (Tools)
           ============================================ */
        .sidebar-left {
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
        }

        .sidebar-section {
            margin-bottom: 24px;
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .tool-btn {
            padding: 12px;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-secondary);
            font-size: 12px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .tool-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .tool-btn .icon {
            font-size: 20px;
            display: block;
            margin-bottom: 4px;
        }

        .enterprise-type-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .enterprise-type-btn {
            padding: 10px 12px;
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 13px;
            text-align: left;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .enterprise-type-btn:hover {
            background: var(--bg-card);
            border-color: var(--primary);
            color: var(--text-primary);
        }

        .enterprise-type-btn .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .type-cooperative .color-dot { background: #8b5cf6; }
        .type-social-enterprise .color-dot { background: #ec4899; }
        .type-producer .color-dot { background: #10b981; }
        .type-consumer .color-dot { background: #f59e0b; }
        .type-service-provider .color-dot { background: #3b82f6; }
        .type-other .color-dot { background: #6b7280; }

        /* ============================================
           Main Canvas Area
           ============================================ */
        .canvas-container {
            background: linear-gradient(135deg, #1a1a2e 0%, #16162a 100%);
            position: relative;
            overflow: hidden;
        }

        .diagram-canvas {
            width: 100%;
            height: 100%;
            cursor: grab;
        }

        .diagram-canvas:active {
            cursor: grabbing;
        }

        .canvas-zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            background: var(--bg-card);
            border-radius: 8px;
            padding: 4px;
            box-shadow: var(--shadow-lg);
        }

        .zoom-btn {
            width: 36px;
            height: 36px;
            background: var(--bg-hover);
            border: none;
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition);
        }

        .zoom-btn:hover {
            background: var(--primary);
        }

        .zoom-level {
            padding: 0 12px;
            display: flex;
            align-items: center;
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Enterprise Nodes */
        .enterprise-node {
            position: absolute;
            min-width: 150px;
            background: var(--bg-card);
            border: 2px solid var(--primary);
            border-radius: var(--radius);
            padding: 16px;
            cursor: move;
            transition: box-shadow 0.2s ease;
            user-select: none;
        }

        .enterprise-node:hover {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .enterprise-node.selected {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.3);
        }

        .enterprise-node .name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .enterprise-node .type {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Relationship Lines */
        .relationship-line {
            stroke: var(--primary);
            stroke-width: 2;
            fill: none;
        }

        /* ============================================
           Sidebar - Right (Properties)
           ============================================ */
        .sidebar-right {
            background: var(--bg-card);
            border-left: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
        }

        .panel-close {
            width: 28px;
            height: 28px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            border-radius: 6px;
            transition: var(--transition);
        }

        .panel-close:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition);
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .color-picker-row {
            display: flex;
            gap: 8px;
        }

        .color-swatch {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
        }

        .color-swatch:hover,
        .color-swatch.active {
            border-color: white;
            transform: scale(1.1);
        }

        .btn-save {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-save:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
        }

        /* ============================================
           Modal Dialogs
           ============================================ */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal {
            background: var(--bg-card);
            border-radius: 16px;
            width: 90%;
            max-width: 500px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            border-radius: 8px;
        }

        .modal-close:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* ============================================
           Toast Notifications
           ============================================ */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 14px 20px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: toast-enter 0.3s ease;
        }

        @keyframes toast-enter {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.warning { border-left: 4px solid var(--warning); }
        .toast.error { border-left: 4px solid var(--error); }

        /* ============================================
           Empty State
           ============================================ */
        .empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .empty-state-hint {
            font-size: 14px;
            opacity: 0.7;
        }

        /* ============================================
           Responsive
           ============================================ */
        @media (max-width: 1024px) {
            .app-container {
                grid-template-columns: 1fr;
            }

            .sidebar-left,
            .sidebar-right {
                position: fixed;
                top: 60px;
                bottom: 0;
                width: 300px;
                z-index: 100;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar-right {
                right: 0;
                left: auto;
                transform: translateX(100%);
            }

            .sidebar-left.open {
                transform: translateX(0);
            }

            .sidebar-right.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header / Toolbar -->
        <header class="app-header">
            <div class="logo">
                <div class="logo-icon">🗺️</div>
                <span>Co-opMaps</span>
            </div>

            <div class="toolbar">
                <button class="toolbar-btn" id="btn-new-diagram" data-action="new-diagram">
                    <span>📄</span> New
                </button>
                <button class="toolbar-btn primary" id="btn-add-enterprise" data-action="add-enterprise">
                    <span>➕</span> Add Enterprise
                </button>
                <button class="toolbar-btn" id="btn-add-relationship" data-action="add-relationship">
                    <span>🔗</span> Add Relationship
                </button>
                <button class="toolbar-btn" id="btn-save" data-action="save">
                    <span>💾</span> Save
                </button>
                <div class="toolbar-dropdown">
                    <button class="toolbar-btn" id="menu-file" data-menu="export">
                        <span>📤</span> Export
                    </button>
                </div>
            </div>

            <div class="header-actions">
                <input type="text" class="diagram-name-input" id="diagram-name" data-field="diagram-name" placeholder="Untitled Diagram">
                <button class="toolbar-btn" id="btn-share" data-action="share">
                    <span>👥</span> Share
                </button>
                <button class="toolbar-btn" id="btn-help" data-action="help">
                    <span>❓</span>
                </button>
            </div>
        </header>

        <!-- Left Sidebar - Tools -->
        <aside class="sidebar-left">
            <div class="sidebar-section">
                <h3 class="sidebar-section-title">Enterprise Types</h3>
                <div class="enterprise-type-list">
                    <button class="enterprise-type-btn type-cooperative" data-type="cooperative">
                        <span class="color-dot"></span>
                        Cooperative
                    </button>
                    <button class="enterprise-type-btn type-social-enterprise" data-type="social_enterprise">
                        <span class="color-dot"></span>
                        Social Enterprise
                    </button>
                    <button class="enterprise-type-btn type-producer" data-type="producer">
                        <span class="color-dot"></span>
                        Producer
                    </button>
                    <button class="enterprise-type-btn type-consumer" data-type="consumer">
                        <span class="color-dot"></span>
                        Consumer
                    </button>
                    <button class="enterprise-type-btn type-service-provider" data-type="service_provider">
                        <span class="color-dot"></span>
                        Service Provider
                    </button>
                    <button class="enterprise-type-btn type-other" data-type="other">
                        <span class="color-dot"></span>
                        Other
                    </button>
                </div>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-section-title">Tools</h3>
                <div class="tool-grid">
                    <button class="tool-btn" data-tool="select">
                        <span class="icon">👆</span>
                        Select
                    </button>
                    <button class="tool-btn" data-tool="pan">
                        <span class="icon">✋</span>
                        Pan
                    </button>
                    <button class="tool-btn" data-tool="zoom-in">
                        <span class="icon">🔍</span>
                        Zoom In
                    </button>
                    <button class="tool-btn" data-tool="zoom-out">
                        <span class="icon">🔎</span>
                        Zoom Out
                    </button>
                </div>
            </div>

            <div class="sidebar-section">
                <h3 class="sidebar-section-title">Views</h3>
                <div class="tool-grid">
                    <button class="tool-btn" id="btn-comments" data-action="comments">
                        <span class="icon">💬</span>
                        Comments
                    </button>
                    <button class="tool-btn" id="btn-versions" data-action="versions">
                        <span class="icon">📋</span>
                        Versions
                    </button>
                    <button class="tool-btn" id="btn-tags" data-action="tags">
                        <span class="icon">🏷️</span>
                        Tags
                    </button>
                    <button class="tool-btn" data-action="notifications">
                        <span class="icon">🔔</span>
                        Alerts
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Canvas -->
        <main class="canvas-container">
            <canvas class="diagram-canvas" id="canvas" data-element="canvas"></canvas>

            <div class="empty-state" id="empty-state">
                <div class="empty-state-icon">🗺️</div>
                <p class="empty-state-text">Your cooperative ecosystem starts here</p>
                <p class="empty-state-hint">Click "Add Enterprise" to begin mapping</p>
            </div>

            <div class="canvas-zoom-controls">
                <button class="zoom-btn" id="zoom-out">−</button>
                <span class="zoom-level" id="zoom-level">100%</span>
                <button class="zoom-btn" id="zoom-in">+</button>
                <button class="zoom-btn" id="zoom-fit">⊡</button>
            </div>
        </main>

        <!-- Right Sidebar - Properties -->
        <aside class="sidebar-right" id="properties-panel">
            <div class="panel-header">
                <h3 class="panel-title">Properties</h3>
                <button class="panel-close">&times;</button>
            </div>

            <form class="enterprise-form" id="enterprise-form">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-input" id="enterprise-name" placeholder="Enterprise name">
                </div>

                <div class="form-group">
                    <label class="form-label">Type</label>
                    <select class="form-select" id="enterprise-type">
                        <option value="cooperative">Cooperative</option>
                        <option value="social_enterprise">Social Enterprise</option>
                        <option value="producer">Producer</option>
                        <option value="consumer">Consumer</option>
                        <option value="service_provider">Service Provider</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-textarea" id="enterprise-description" placeholder="Brief description..."></textarea>
                </div>

                <div class="form-group" id="style-options" data-panel="style">
                    <label class="form-label">Color</label>
                    <div class="color-picker-row">
                        <div class="color-swatch active" style="background: #8b5cf6;" data-color="#8b5cf6"></div>
                        <div class="color-swatch" style="background: #ec4899;" data-color="#ec4899"></div>
                        <div class="color-swatch" style="background: #10b981;" data-color="#10b981"></div>
                        <div class="color-swatch" style="background: #f59e0b;" data-color="#f59e0b"></div>
                        <div class="color-swatch" style="background: #3b82f6;" data-color="#3b82f6"></div>
                        <div class="color-swatch" style="background: #6b7280;" data-color="#6b7280"></div>
                    </div>
                </div>

                <button type="submit" class="btn-save">Save Enterprise</button>
            </form>
        </aside>
    </div>

    <!-- Export Modal -->
    <div class="modal-backdrop" id="export-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Export Diagram</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Format</label>
                    <select class="form-select" id="export-format">
                        <option value="png">PNG Image</option>
                        <option value="pdf">PDF Document</option>
                        <option value="svg">SVG Vector</option>
                        <option value="json">JSON Data</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Quality</label>
                    <select class="form-select" id="export-quality">
                        <option value="standard">Standard (1x)</option>
                        <option value="high">High (2x)</option>
                        <option value="ultra">Ultra (4x)</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="toolbar-btn" onclick="closeModal('export-modal')">Cancel</button>
                <button class="toolbar-btn primary" onclick="exportDiagram()">Export</button>
            </div>
        </div>
    </div>

    <!-- Share Modal -->
    <div class="modal-backdrop" id="share-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">Share Diagram</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Invite by Email</label>
                    <input type="email" class="form-input" placeholder="colleague@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Permission</label>
                    <select class="form-select">
                        <option value="view">Can View</option>
                        <option value="edit">Can Edit</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="toolbar-btn" onclick="closeModal('share-modal')">Cancel</button>
                <button class="toolbar-btn primary">Send Invite</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Scripts -->
    <script src="js/tutorial-manager.js"></script>
    <script>
        /**
         * Co-opMaps Deluxe - Main Application
         * Integrates with Tutorial System
         */
        (function() {
            'use strict';

            // Application State
            var AppState = {
                diagram: {
                    id: null,
                    name: 'Untitled Diagram',
                    enterprises: [],
                    relationships: [],
                    createdAt: null,
                    modifiedAt: null
                },
                selectedEnterprise: null,
                zoom: 1,
                pan: { x: 0, y: 0 },
                isDragging: false,
                isCreatingRelationship: false,
                relationshipSource: null
            };

            // Canvas setup
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d');
            var enterpriseCounter = 0;

            function resizeCanvas() {
                var container = canvas.parentElement;
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
                render();
            }

            // Initialize canvas
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Render the diagram
            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Draw grid
                drawGrid();

                // Draw relationships
                AppState.diagram.relationships.forEach(function(rel) {
                    drawRelationship(rel);
                });

                // Draw enterprises
                AppState.diagram.enterprises.forEach(function(ent) {
                    drawEnterprise(ent);
                });

                // Update empty state visibility
                var emptyState = document.getElementById('empty-state');
                emptyState.style.display = AppState.diagram.enterprises.length === 0 ? 'block' : 'none';
            }

            function drawGrid() {
                var gridSize = 30 * AppState.zoom;
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
                ctx.lineWidth = 1;

                for (var x = 0; x < canvas.width; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvas.height);
                    ctx.stroke();
                }

                for (var y = 0; y < canvas.height; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(canvas.width, y);
                    ctx.stroke();
                }
            }

            function drawEnterprise(ent) {
                var x = ent.x * AppState.zoom + AppState.pan.x;
                var y = ent.y * AppState.zoom + AppState.pan.y;
                var width = 160 * AppState.zoom;
                var height = 80 * AppState.zoom;
                var radius = 12 * AppState.zoom;

                // Draw shadow
                ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
                ctx.shadowBlur = 15 * AppState.zoom;
                ctx.shadowOffsetY = 5 * AppState.zoom;

                // Draw card background
                ctx.fillStyle = '#1a1a2e';
                roundRect(ctx, x, y, width, height, radius, true, false);

                // Reset shadow
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;

                // Draw border
                ctx.strokeStyle = AppState.selectedEnterprise === ent ? '#ec4899' : (ent.color || '#8b5cf6');
                ctx.lineWidth = 2 * AppState.zoom;
                roundRect(ctx, x, y, width, height, radius, false, true);

                // Draw name
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold ' + (14 * AppState.zoom) + 'px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(ent.name, x + width / 2, y + height / 2 - 5 * AppState.zoom);

                // Draw type
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.font = (11 * AppState.zoom) + 'px Inter, sans-serif';
                ctx.fillText(ent.type.replace('_', ' ').toUpperCase(), x + width / 2, y + height / 2 + 15 * AppState.zoom);
            }

            function drawRelationship(rel) {
                var source = AppState.diagram.enterprises.find(function(e) { return e.id === rel.sourceId; });
                var target = AppState.diagram.enterprises.find(function(e) { return e.id === rel.targetId; });

                if (!source || !target) return;

                var sx = (source.x + 80) * AppState.zoom + AppState.pan.x;
                var sy = (source.y + 40) * AppState.zoom + AppState.pan.y;
                var tx = (target.x + 80) * AppState.zoom + AppState.pan.x;
                var ty = (target.y + 40) * AppState.zoom + AppState.pan.y;

                ctx.strokeStyle = '#8b5cf6';
                ctx.lineWidth = 2 * AppState.zoom;
                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(tx, ty);
                ctx.stroke();

                // Draw arrow
                var angle = Math.atan2(ty - sy, tx - sx);
                var arrowLength = 15 * AppState.zoom;
                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.lineTo(tx - arrowLength * Math.cos(angle - 0.3), ty - arrowLength * Math.sin(angle - 0.3));
                ctx.moveTo(tx, ty);
                ctx.lineTo(tx - arrowLength * Math.cos(angle + 0.3), ty - arrowLength * Math.sin(angle + 0.3));
                ctx.stroke();
            }

            function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
                if (fill) ctx.fill();
                if (stroke) ctx.stroke();
            }

            // Event Handlers

            // New Diagram
            document.getElementById('btn-new-diagram').addEventListener('click', function() {
                AppState.diagram = {
                    id: 'diagram_' + Date.now(),
                    name: 'Untitled Diagram',
                    enterprises: [],
                    relationships: [],
                    createdAt: new Date(),
                    modifiedAt: new Date()
                };
                document.getElementById('diagram-name').value = '';
                render();
                showToast('New diagram created', 'success');

                // Dispatch event for tutorial
                document.dispatchEvent(new CustomEvent('coopmaps:diagram:created'));
            });

            // Add Enterprise
            document.getElementById('btn-add-enterprise').addEventListener('click', function() {
                addEnterprise();
            });

            // Enterprise type buttons
            document.querySelectorAll('.enterprise-type-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var type = this.getAttribute('data-type');
                    addEnterprise(type);
                });
            });

            function addEnterprise(type) {
                type = type || 'cooperative';
                enterpriseCounter++;

                var enterprise = {
                    id: 'ent_' + Date.now(),
                    name: 'Enterprise ' + enterpriseCounter,
                    type: type,
                    description: '',
                    x: 100 + Math.random() * 300,
                    y: 100 + Math.random() * 200,
                    color: getColorForType(type)
                };

                AppState.diagram.enterprises.push(enterprise);
                AppState.selectedEnterprise = enterprise;
                updatePropertiesPanel(enterprise);
                render();

                showToast('Enterprise added', 'success');

                // Dispatch event for tutorial
                document.dispatchEvent(new CustomEvent('coopmaps:enterprise:added'));
            }

            function getColorForType(type) {
                var colors = {
                    cooperative: '#8b5cf6',
                    social_enterprise: '#ec4899',
                    producer: '#10b981',
                    consumer: '#f59e0b',
                    service_provider: '#3b82f6',
                    other: '#6b7280'
                };
                return colors[type] || '#8b5cf6';
            }

            function updatePropertiesPanel(ent) {
                document.getElementById('enterprise-name').value = ent.name;
                document.getElementById('enterprise-type').value = ent.type;
                document.getElementById('enterprise-description').value = ent.description || '';

                // Update color swatches
                document.querySelectorAll('.color-swatch').forEach(function(swatch) {
                    swatch.classList.toggle('active', swatch.dataset.color === ent.color);
                });
            }

            // Add Relationship
            document.getElementById('btn-add-relationship').addEventListener('click', function() {
                if (AppState.diagram.enterprises.length < 2) {
                    showToast('Add at least 2 enterprises first', 'warning');
                    return;
                }

                AppState.isCreatingRelationship = true;
                showToast('Click on source enterprise, then target', 'info');
            });

            // Canvas click for enterprise selection and relationship creation
            canvas.addEventListener('click', function(e) {
                var rect = canvas.getBoundingClientRect();
                var x = (e.clientX - rect.left - AppState.pan.x) / AppState.zoom;
                var y = (e.clientY - rect.top - AppState.pan.y) / AppState.zoom;

                // Find clicked enterprise
                var clicked = null;
                AppState.diagram.enterprises.forEach(function(ent) {
                    if (x >= ent.x && x <= ent.x + 160 && y >= ent.y && y <= ent.y + 80) {
                        clicked = ent;
                    }
                });

                if (AppState.isCreatingRelationship) {
                    if (clicked) {
                        if (!AppState.relationshipSource) {
                            AppState.relationshipSource = clicked;
                            showToast('Now click on target enterprise', 'info');
                        } else if (clicked !== AppState.relationshipSource) {
                            // Create relationship
                            AppState.diagram.relationships.push({
                                id: 'rel_' + Date.now(),
                                sourceId: AppState.relationshipSource.id,
                                targetId: clicked.id,
                                type: 'partner'
                            });
                            AppState.isCreatingRelationship = false;
                            AppState.relationshipSource = null;
                            render();
                            showToast('Relationship created', 'success');

                            // Dispatch event for tutorial
                            document.dispatchEvent(new CustomEvent('coopmaps:relationship:created'));
                        }
                    }
                } else {
                    AppState.selectedEnterprise = clicked;
                    if (clicked) {
                        updatePropertiesPanel(clicked);
                    }
                    render();
                }
            });

            // Canvas drag for moving enterprises
            var dragState = { isDragging: false, enterprise: null, offsetX: 0, offsetY: 0 };

            canvas.addEventListener('mousedown', function(e) {
                var rect = canvas.getBoundingClientRect();
                var x = (e.clientX - rect.left - AppState.pan.x) / AppState.zoom;
                var y = (e.clientY - rect.top - AppState.pan.y) / AppState.zoom;

                AppState.diagram.enterprises.forEach(function(ent) {
                    if (x >= ent.x && x <= ent.x + 160 && y >= ent.y && y <= ent.y + 80) {
                        dragState.isDragging = true;
                        dragState.enterprise = ent;
                        dragState.offsetX = x - ent.x;
                        dragState.offsetY = y - ent.y;
                    }
                });
            });

            canvas.addEventListener('mousemove', function(e) {
                if (dragState.isDragging && dragState.enterprise) {
                    var rect = canvas.getBoundingClientRect();
                    var x = (e.clientX - rect.left - AppState.pan.x) / AppState.zoom;
                    var y = (e.clientY - rect.top - AppState.pan.y) / AppState.zoom;

                    dragState.enterprise.x = x - dragState.offsetX;
                    dragState.enterprise.y = y - dragState.offsetY;
                    render();

                    // Dispatch event for tutorial
                    document.dispatchEvent(new CustomEvent('coopmaps:enterprise:moved'));
                }
            });

            canvas.addEventListener('mouseup', function() {
                dragState.isDragging = false;
                dragState.enterprise = null;
            });

            // Canvas zoom with mouse wheel
            canvas.addEventListener('wheel', function(e) {
                e.preventDefault();
                var delta = e.deltaY > 0 ? -0.1 : 0.1;
                AppState.zoom = Math.max(0.25, Math.min(3, AppState.zoom + delta));
                document.getElementById('zoom-level').textContent = Math.round(AppState.zoom * 100) + '%';
                render();

                // Dispatch event for tutorial
                document.dispatchEvent(new CustomEvent('coopmaps:canvas:navigated'));
            });

            // Zoom buttons
            document.getElementById('zoom-in').addEventListener('click', function() {
                AppState.zoom = Math.min(3, AppState.zoom + 0.1);
                document.getElementById('zoom-level').textContent = Math.round(AppState.zoom * 100) + '%';
                render();
            });

            document.getElementById('zoom-out').addEventListener('click', function() {
                AppState.zoom = Math.max(0.25, AppState.zoom - 0.1);
                document.getElementById('zoom-level').textContent = Math.round(AppState.zoom * 100) + '%';
                render();
            });

            document.getElementById('zoom-fit').addEventListener('click', function() {
                AppState.zoom = 1;
                AppState.pan = { x: 0, y: 0 };
                document.getElementById('zoom-level').textContent = '100%';
                render();
            });

            // Save button
            document.getElementById('btn-save').addEventListener('click', function() {
                AppState.diagram.name = document.getElementById('diagram-name').value || 'Untitled Diagram';
                AppState.diagram.modifiedAt = new Date();

                // Save to localStorage
                try {
                    localStorage.setItem('coopmaps_current_diagram', JSON.stringify(AppState.diagram));
                    showToast('Diagram saved', 'success');

                    // Dispatch event for tutorial
                    document.dispatchEvent(new CustomEvent('coopmaps:diagram:saved'));
                } catch (e) {
                    showToast('Failed to save diagram', 'error');
                }
            });

            // Export menu
            document.getElementById('menu-file').addEventListener('click', function() {
                document.getElementById('export-modal').classList.add('active');

                // Dispatch event for tutorial
                document.dispatchEvent(new CustomEvent('coopmaps:export:opened'));
            });

            // Share button
            document.getElementById('btn-share').addEventListener('click', function() {
                document.getElementById('share-modal').classList.add('active');

                // Dispatch event for tutorial
                document.dispatchEvent(new CustomEvent('coopmaps:share:opened'));
            });

            // Comments button
            document.getElementById('btn-comments').addEventListener('click', function() {
                showToast('Comments panel opened', 'info');

                // Dispatch event for tutorial
                document.dispatchEvent(new CustomEvent('coopmaps:comments:opened'));
            });

            // Versions button
            document.getElementById('btn-versions').addEventListener('click', function() {
                showToast('Version history panel opened', 'info');

                // Dispatch event for tutorial
                document.dispatchEvent(new CustomEvent('coopmaps:versions:opened'));
            });

            // Tags button
            document.getElementById('btn-tags').addEventListener('click', function() {
                showToast('Tags panel opened', 'info');

                // Dispatch event for tutorial
                document.dispatchEvent(new CustomEvent('coopmaps:tags:viewed'));
            });

            // Color swatches
            document.querySelectorAll('.color-swatch').forEach(function(swatch) {
                swatch.addEventListener('click', function() {
                    if (AppState.selectedEnterprise) {
                        AppState.selectedEnterprise.color = this.dataset.color;
                        document.querySelectorAll('.color-swatch').forEach(function(s) {
                            s.classList.remove('active');
                        });
                        this.classList.add('active');
                        render();

                        // Dispatch event for tutorial
                        document.dispatchEvent(new CustomEvent('coopmaps:style:changed'));
                    }
                });
            });

            // Enterprise form submission
            document.getElementById('enterprise-form').addEventListener('submit', function(e) {
                e.preventDefault();

                if (AppState.selectedEnterprise) {
                    AppState.selectedEnterprise.name = document.getElementById('enterprise-name').value;
                    AppState.selectedEnterprise.type = document.getElementById('enterprise-type').value;
                    AppState.selectedEnterprise.description = document.getElementById('enterprise-description').value;
                    AppState.selectedEnterprise.color = getColorForType(AppState.selectedEnterprise.type);
                    render();
                    showToast('Enterprise updated', 'success');

                    // Dispatch event for tutorial
                    document.dispatchEvent(new CustomEvent('coopmaps:enterprise:configured'));
                }
            });

            // Modal close handlers
            document.querySelectorAll('.modal-close').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    this.closest('.modal-backdrop').classList.remove('active');
                });
            });

            document.querySelectorAll('.modal-backdrop').forEach(function(modal) {
                modal.addEventListener('click', function(e) {
                    if (e.target === this) {
                        this.classList.remove('active');
                    }
                });
            });

            window.closeModal = function(id) {
                document.getElementById(id).classList.remove('active');
            };

            window.exportDiagram = function() {
                var format = document.getElementById('export-format').value;
                showToast('Exporting as ' + format.toUpperCase() + '...', 'info');
                closeModal('export-modal');

                // Simulate export
                setTimeout(function() {
                    showToast('Export complete!', 'success');
                }, 1000);
            };

            // Toast notification system
            function showToast(message, type) {
                type = type || 'info';
                var container = document.getElementById('toast-container');
                var toast = document.createElement('div');
                toast.className = 'toast ' + type;
                toast.innerHTML = '<span>' + message + '</span>';
                container.appendChild(toast);

                setTimeout(function() {
                    toast.style.opacity = '0';
                    setTimeout(function() {
                        toast.remove();
                    }, 300);
                }, 3000);
            }

            // Help button - restart tutorial
            document.getElementById('btn-help').addEventListener('click', function() {
                if (typeof TutorialManager !== 'undefined') {
                    if (confirm('Would you like to start the interactive tutorial?')) {
                        TutorialManager.start(true);
                    }
                }
            });

            // Check if we should start the tutorial
            function checkTutorialStart() {
                var urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('startTutorial') === 'true') {
                    // Remove the parameter from URL
                    window.history.replaceState({}, '', window.location.pathname);

                    // Start tutorial after a short delay
                    setTimeout(function() {
                        if (typeof TutorialManager !== 'undefined') {
                            TutorialManager.start(true);
                        }
                    }, 500);
                }
            }

            // Load saved diagram
            function loadSavedDiagram() {
                try {
                    var saved = localStorage.getItem('coopmaps_current_diagram');
                    if (saved) {
                        var diagram = JSON.parse(saved);
                        AppState.diagram = diagram;
                        document.getElementById('diagram-name').value = diagram.name;
                        enterpriseCounter = diagram.enterprises.length;
                        render();
                    }
                } catch (e) {
                    console.log('No saved diagram found');
                }
            }

            // Initialize
            loadSavedDiagram();
            checkTutorialStart();
            render();

        })();
    </script>
</body>
</html>
