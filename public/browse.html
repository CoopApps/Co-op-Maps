<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Community Maps - Co-op Maps</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5a6fd6;
            --secondary: #764ba2;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --darker: #1a252f;
            --gray: #7f8c8d;
            --light-gray: #ecf0f1;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f6fa;
            color: var(--dark);
            min-height: 100vh;
        }

        /* Header - matches deluxe */
        .header {
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: white;
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .header-logo svg {
            width: 22px;
            height: 22px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header h1 span {
            opacity: 0.6;
            font-weight: 400;
            margin-left: 8px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-header {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-header:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-header.primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border: none;
        }

        .btn-header.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        /* Search Section */
        .search-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 25px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            animation: slideUp 0.5s ease-out;
        }

        .search-wrapper {
            display: flex;
            gap: 12px;
        }

        .search-input-container {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            stroke: var(--gray);
            stroke-width: 2;
            fill: none;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 52px;
            border: 2px solid var(--light-gray);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .search-input::placeholder {
            color: #bdc3c7;
        }

        .btn-search {
            padding: 16px 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            animation: slideUp 0.5s ease-out 0.1s both;
        }

        .stat-item {
            background: white;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            color: var(--gray);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .stat-item strong {
            color: var(--dark);
            font-size: 20px;
            font-weight: 700;
        }

        .stat-item svg {
            width: 18px;
            height: 18px;
            stroke: var(--primary);
            stroke-width: 2;
            fill: none;
        }

        /* Maps Grid */
        .maps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 30px;
        }

        /* Map Card */
        .map-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: slideUp 0.5s ease-out both;
            position: relative;
        }

        .map-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            opacity: 0;
            transition: opacity 0.3s;
        }

        .map-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .map-card:hover::before {
            opacity: 1;
        }

        .map-thumbnail {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .map-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .map-card:hover .map-thumbnail img {
            transform: scale(1.05);
        }

        .map-thumbnail.no-image {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        .map-thumbnail.no-image svg {
            width: 50px;
            height: 50px;
            opacity: 0.4;
        }

        .map-info {
            padding: 20px;
        }

        .map-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .map-author {
            font-size: 14px;
            color: var(--gray);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .author-avatar {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .author-avatar svg {
            width: 12px;
            height: 12px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        .map-description {
            font-size: 14px;
            color: #95a5a6;
            margin-bottom: 15px;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .map-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tag {
            padding: 5px 12px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-radius: 20px;
            font-size: 12px;
            color: var(--primary);
            font-weight: 500;
            transition: all 0.2s;
        }

        .tag:hover {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        .map-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #bdc3c7;
            padding-top: 15px;
            border-top: 1px solid var(--light-gray);
        }

        .map-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .map-meta svg {
            width: 14px;
            height: 14px;
        }

        /* Timeline Badge */
        .timeline-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 8px rgba(155, 89, 182, 0.4);
            z-index: 2;
        }

        .timeline-badge svg {
            width: 12px;
            height: 12px;
        }

        /* Timeline Preview Strip */
        .timeline-preview {
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.1) 0%, rgba(142, 68, 173, 0.1) 100%);
            padding: 12px 20px;
            border-top: 1px solid rgba(155, 89, 182, 0.2);
        }

        .timeline-preview-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-size: 12px;
            font-weight: 600;
            color: #8e44ad;
        }

        .timeline-preview-header svg {
            width: 14px;
            height: 14px;
            stroke: #8e44ad;
        }

        .timeline-dots-container {
            display: flex;
            align-items: center;
            gap: 4px;
            position: relative;
        }

        .timeline-line {
            position: absolute;
            top: 50%;
            left: 8px;
            right: 8px;
            height: 2px;
            background: rgba(155, 89, 182, 0.3);
            transform: translateY(-50%);
            z-index: 0;
        }

        .timeline-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: white;
            border: 2px solid #9b59b6;
            position: relative;
            z-index: 1;
            cursor: pointer;
            transition: all 0.2s;
        }

        .timeline-dot:hover {
            background: #9b59b6;
            transform: scale(1.2);
        }

        .timeline-dot:first-child {
            background: #9b59b6;
        }

        .timeline-dot:last-child {
            background: #27ae60;
            border-color: #27ae60;
        }

        .timeline-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 10px;
            color: #7f8c8d;
        }

        /* Featured Badge */
        .featured-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(243, 156, 18, 0.4);
            z-index: 2;
        }

        .wdr-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: 'Monaco', 'Consolas', monospace;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 6px rgba(39, 174, 96, 0.3);
            flex-shrink: 0;
        }

        .wdr-badge svg {
            width: 12px;
            height: 12px;
            stroke-width: 2.5;
        }

        .map-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
        }

        .map-title-row .map-title {
            margin-bottom: 0;
            flex: 1;
            min-width: 0;
        }

        /* Skeleton Loading */
        .skeleton-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            animation: slideUp 0.5s ease-out both;
        }

        .skeleton-thumbnail {
            width: 100%;
            height: 180px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        .skeleton-info {
            padding: 20px;
        }

        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e8e8e8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 7px;
            margin-bottom: 12px;
        }

        .skeleton-line.short { width: 50%; }
        .skeleton-line.medium { width: 75%; }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 80px 20px;
            color: white;
            grid-column: 1 / -1;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: white;
            border-radius: 50%;
            margin: 0 auto 20px;
            animation: spin 1s linear infinite;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: white;
            grid-column: 1 / -1;
            animation: fadeIn 0.5s ease-out;
        }

        .empty-state-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            opacity: 0.4;
        }

        .empty-state h2 {
            font-size: 26px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .empty-state p {
            opacity: 0.7;
            font-size: 16px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease-out;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.3s ease-out;
            text-align: center;
        }

        .modal-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .modal-icon svg {
            width: 35px;
            height: 35px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        .modal h2 {
            margin-bottom: 10px;
            color: var(--dark);
            font-size: 24px;
            font-weight: 600;
        }

        .modal p {
            color: var(--gray);
            margin-bottom: 30px;
            font-size: 15px;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-express {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-express:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.3);
        }

        .btn-deluxe {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        .btn-deluxe:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-cancel {
            background: var(--light-gray);
            color: var(--gray);
            flex: 0.6;
        }

        .btn-cancel:hover {
            background: #dfe6e9;
            color: var(--dark);
        }

        /* Enhanced Modal */
        .modal-content.large {
            max-width: 600px;
        }

        .modal-map-info {
            text-align: left;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .modal-map-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .modal-map-author {
            font-size: 14px;
            color: var(--gray);
            margin-bottom: 12px;
        }

        .modal-map-description {
            font-size: 13px;
            color: #95a5a6;
            line-height: 1.5;
        }

        .modal-timeline-section {
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.1) 0%, rgba(142, 68, 173, 0.1) 100%);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
        }

        .modal-timeline-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            font-weight: 600;
            color: #8e44ad;
        }

        .modal-timeline-header svg {
            width: 20px;
            height: 20px;
            stroke: #8e44ad;
        }

        .modal-timeline-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .modal-timeline-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: white;
            border-radius: 8px;
            font-size: 13px;
        }

        .modal-timeline-item .year {
            font-weight: 700;
            color: #9b59b6;
            min-width: 50px;
        }

        .modal-timeline-item .label {
            color: var(--dark);
            flex: 1;
        }

        .modal-timeline-item .date {
            color: var(--gray);
            font-size: 11px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .maps-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                flex-wrap: wrap;
            }

            .stat-item {
                flex: 1;
                min-width: 140px;
            }

            .search-wrapper {
                flex-direction: column;
            }

            .modal-buttons {
                flex-direction: column;
            }

            .btn-cancel {
                flex: 1;
            }

            .header h1 span {
                display: none;
            }

            .header-actions {
                gap: 6px;
            }

            .btn-header {
                padding: 6px 12px;
                font-size: 12px;
            }

            /* Timeline preview mobile fixes */
            .timeline-preview {
                padding: 10px 15px;
            }

            .timeline-dots-container {
                overflow-x: auto;
                padding-bottom: 5px;
            }

            .timeline-labels {
                font-size: 9px;
            }

            .timeline-labels span {
                max-width: 100px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            /* Modal mobile fixes */
            .modal-content {
                padding: 25px;
                width: 95%;
            }

            .modal-content.large {
                max-width: 100%;
            }

            .modal-map-info {
                padding: 15px;
            }

            .modal-timeline-section {
                padding: 15px;
            }

            .modal-timeline-list {
                max-height: 150px;
            }

            .modal-timeline-item {
                padding: 8px 10px;
                font-size: 12px;
            }

            .modal-timeline-item .year {
                min-width: 40px;
                font-size: 12px;
            }

            .modal-timeline-item .date {
                display: none;
            }

            /* Map card mobile fixes */
            .map-thumbnail {
                height: 160px;
            }

            .map-info {
                padding: 15px;
            }

            .map-title {
                font-size: 16px;
            }

            .timeline-badge {
                padding: 4px 10px;
                font-size: 10px;
            }

            .featured-badge {
                font-size: 9px;
                padding: 4px 8px;
            }
        }

        /* Extra small screens */
        @media (max-width: 480px) {
            .container {
                padding: 20px 15px 40px;
            }

            .search-section {
                padding: 18px;
                border-radius: 12px;
            }

            .search-input {
                padding: 14px 16px 14px 45px;
                font-size: 14px;
            }

            .btn-search {
                padding: 14px 20px;
            }

            .header {
                padding: 0 15px;
            }

            .header h1 {
                font-size: 16px;
            }

            .stat-item {
                padding: 12px 15px;
            }

            .stat-item strong {
                font-size: 18px;
            }

            /* Timeline extremely compact on tiny screens */
            .timeline-preview {
                padding: 8px 12px;
            }

            .timeline-preview-header {
                font-size: 11px;
                margin-bottom: 8px;
            }

            .timeline-dot {
                width: 12px;
                height: 12px;
            }

            .modal-content {
                padding: 20px;
                border-radius: 16px;
            }

            .modal-icon {
                width: 50px;
                height: 50px;
                border-radius: 14px;
            }

            .modal-icon svg {
                width: 26px;
                height: 26px;
            }

            .modal h2 {
                font-size: 20px;
            }

            .modal p {
                font-size: 14px;
            }

            .modal-buttons button {
                padding: 14px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="header-left">
                <div class="header-logo">
                    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
                        <line x1="9" y1="3" x2="9" y2="18"/>
                        <line x1="15" y1="6" x2="15" y2="21"/>
                    </svg>
                </div>
                <h1>Community Maps<span>Browse & Explore</span></h1>
            </div>
            <div class="header-actions">
                <a href="index.html" class="btn-header">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                    Home
                </a>
                <a href="deluxe.html" class="btn-header primary">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Create Map
                </a>
            </div>
        </div>
    </div>

    <!-- Container -->
    <div class="container">
        <!-- Search Section -->
        <div class="search-section">
            <div class="search-wrapper">
                <div class="search-input-container">
                    <svg class="search-icon" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search maps by title, author, or tags...">
                </div>
                <button class="btn-search" onclick="loadMaps(document.getElementById('searchInput').value)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 6px;">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="M21 21l-4.35-4.35"/>
                    </svg>
                    Search
                </button>
            </div>
        </div>

        <!-- Stats Bar -->
        <div class="stats-bar" id="statsBar" style="display: none;">
            <div class="stat-item">
                <svg viewBox="0 0 24 24">
                    <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
                    <line x1="9" y1="3" x2="9" y2="18"/>
                    <line x1="15" y1="6" x2="15" y2="21"/>
                </svg>
                <strong id="totalMaps">0</strong> maps
            </div>
            <div class="stat-item">
                <svg viewBox="0 0 24 24">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
                <strong id="totalViews">0</strong> total views
            </div>
        </div>

        <!-- Maps Grid -->
        <div id="mapsGrid" class="maps-grid">
            <!-- Skeleton Loading -->
            <div class="skeleton-card">
                <div class="skeleton-thumbnail"></div>
                <div class="skeleton-info">
                    <div class="skeleton-line medium"></div>
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-thumbnail"></div>
                <div class="skeleton-info">
                    <div class="skeleton-line medium"></div>
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line"></div>
                </div>
            </div>
            <div class="skeleton-card">
                <div class="skeleton-thumbnail"></div>
                <div class="skeleton-info">
                    <div class="skeleton-line medium"></div>
                    <div class="skeleton-line short"></div>
                    <div class="skeleton-line"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- View Map Modal -->
    <div id="viewModal" class="modal">
        <div class="modal-content">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24">
                    <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
                    <line x1="9" y1="3" x2="9" y2="18"/>
                    <line x1="15" y1="6" x2="15" y2="21"/>
                </svg>
            </div>
            <h2 id="modalTitle">Open Map</h2>
            <p id="modalDescription">Choose your preferred viewing mode to explore this map</p>
            <div class="modal-buttons">
                <button class="btn-express" onclick="openMapInExpress()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                    Express
                </button>
                <button class="btn-deluxe" onclick="openMapInDeluxe()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                    </svg>
                    Deluxe
                </button>
                <button class="btn-cancel" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="./config.js"></script>
    <script src="./js/api.js"></script>
    <script>
        let currentMapId = null;
        let currentMapData = null; // Store full map data for modal
        let mapsCache = {}; // Cache map data by ID

        // Load maps on page load
        document.addEventListener('DOMContentLoaded', () => loadMaps());

        // Search on Enter key
        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                loadMaps(e.target.value);
            }
        });

        // Debounced search
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                loadMaps(e.target.value);
            }, 500);
        });

        async function loadMaps(search = '') {
            const grid = document.getElementById('mapsGrid');
            const statsBar = document.getElementById('statsBar');

            // Show skeleton loading
            grid.innerHTML = `
                <div class="skeleton-card"><div class="skeleton-thumbnail"></div><div class="skeleton-info"><div class="skeleton-line medium"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-thumbnail"></div><div class="skeleton-info"><div class="skeleton-line medium"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div></div></div>
                <div class="skeleton-card"><div class="skeleton-thumbnail"></div><div class="skeleton-info"><div class="skeleton-line medium"></div><div class="skeleton-line short"></div><div class="skeleton-line"></div></div></div>
            `;

            try {
                const response = await CoopMapsAPI.getApprovedMaps({
                    limit: 50,
                    search: search || undefined
                });

                if (response.maps.length === 0) {
                    statsBar.style.display = 'none';
                    grid.innerHTML = `
                        <div class="empty-state">
                            <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
                                <line x1="9" y1="3" x2="9" y2="18"/>
                                <line x1="15" y1="6" x2="15" y2="21"/>
                            </svg>
                            <h2>${search ? 'No Maps Found' : 'No Community Maps Yet'}</h2>
                            <p>${search ? 'Try a different search term or browse all maps' : 'Be the first to share your co-operative map with the community!'}</p>
                        </div>
                    `;
                    return;
                }

                // Cache maps data and update stats
                response.maps.forEach(map => mapsCache[map.id] = map);
                statsBar.style.display = 'flex';
                document.getElementById('totalMaps').textContent = response.maps.length;
                const totalViews = response.maps.reduce((sum, m) => sum + (m.view_count || 0), 0);
                document.getElementById('totalViews').textContent = totalViews.toLocaleString();

                grid.innerHTML = response.maps.map((map, index) => `
                    <div class="map-card" onclick="showViewModal('${map.id}')" style="animation-delay: ${index * 0.05}s">
                        <div class="map-thumbnail ${map.thumbnail ? '' : 'no-image'}">
                            ${map.is_featured ? '<div class="featured-badge">Featured</div>' : ''}
                            ${map.snapshot_count > 0 ? `
                                <div class="timeline-badge">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"/>
                                        <polyline points="12 6 12 12 16 14"/>
                                    </svg>
                                    ${map.snapshot_count} snapshot${map.snapshot_count !== 1 ? 's' : ''}
                                </div>
                            ` : ''}
                            ${map.thumbnail ?
                                `<img src="${map.thumbnail}" alt="${escapeHtml(map.title)}" loading="lazy">` :
                                `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
                                    <line x1="9" y1="3" x2="9" y2="18"/>
                                    <line x1="15" y1="6" x2="15" y2="21"/>
                                </svg>`
                            }
                        </div>
                        <div class="map-info">
                            <div class="map-title-row">
                                <div class="map-title">${escapeHtml(map.title)}</div>
                                ${map.official_wdr ? `
                                    <div class="wdr-badge" title="Official World Directory Reference">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                            <polyline points="22 4 12 14.01 9 11.01"/>
                                        </svg>
                                        ${escapeHtml(map.official_wdr)}
                                    </div>
                                ` : ''}
                            </div>
                            <div class="map-author">
                                <span class="author-avatar">
                                    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                </span>
                                ${escapeHtml(map.author)}${map.author_organization ? ' <span style="opacity: 0.5;">·</span> ' + escapeHtml(map.author_organization) : ''}
                            </div>
                            ${map.description ?
                                `<div class="map-description">${escapeHtml(map.description)}</div>` :
                                ''
                            }
                            ${map.tags && map.tags.length > 0 ?
                                `<div class="map-tags">
                                    ${map.tags.slice(0, 3).map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                                    ${map.tags.length > 3 ? `<span class="tag">+${map.tags.length - 3}</span>` : ''}
                                </div>` :
                                ''
                            }
                            <div class="map-meta">
                                <span>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                        <circle cx="12" cy="12" r="3"/>
                                    </svg>
                                    ${(map.view_count || 0).toLocaleString()} views
                                </span>
                                <span>${formatDate(map.published_at)}</span>
                            </div>
                        </div>
                        ${map.snapshot_count > 0 && map.timeline_summary ? renderTimelinePreview(map.timeline_summary) : ''}
                    </div>
                `).join('');

                // Helper function to render timeline preview
                function renderTimelinePreview(timeline) {
                    if (!timeline || timeline.length === 0) return '';
                    const first = timeline[0];
                    const last = timeline[timeline.length - 1];
                    const firstYear = first.date ? new Date(first.date).getFullYear() : '';
                    const lastYear = last.date ? new Date(last.date).getFullYear() : '';

                    // Create dots for each snapshot (max 7 visible)
                    const maxDots = 7;
                    const showDots = timeline.length <= maxDots ? timeline : [
                        ...timeline.slice(0, 3),
                        { ellipsis: true },
                        ...timeline.slice(-3)
                    ];

                    const dots = showDots.map((snap, i) =>
                        snap.ellipsis
                            ? '<span style="color: #9b59b6; font-size: 10px;">...</span>'
                            : `<div class="timeline-dot" title="${escapeHtml(snap.label)} (${snap.date})"></div>`
                    ).join('');

                    return `
                        <div class="timeline-preview">
                            <div class="timeline-preview-header">
                                <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"/>
                                    <polyline points="12 6 12 12 16 14"/>
                                </svg>
                                Evolution Timeline
                            </div>
                            <div class="timeline-dots-container">
                                <div class="timeline-line"></div>
                                ${dots}
                            </div>
                            <div class="timeline-labels">
                                <span>${firstYear}${first.label ? ' - ' + escapeHtml(first.label).substring(0, 15) : ''}</span>
                                <span>${lastYear}${last.label ? ' - ' + escapeHtml(last.label).substring(0, 15) : ''}</span>
                            </div>
                        </div>
                    `;
                }

            } catch (error) {
                console.error('Error loading maps:', error);
                grid.innerHTML = `
                    <div class="empty-state">
                        <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                        <h2>Error Loading Maps</h2>
                        <p>${error.message || 'Please check your connection and try again'}</p>
                    </div>
                `;
            }
        }

        function showViewModal(mapId) {
            currentMapId = mapId;
            currentMapData = mapsCache[mapId];

            if (!currentMapData) {
                console.error('Map not found in cache:', mapId);
                return;
            }

            const modal = document.getElementById('viewModal');
            const content = modal.querySelector('.modal-content');

            // Build modal content dynamically based on map data
            const hasTimeline = currentMapData.snapshot_count > 0 && currentMapData.timeline_summary;
            const timelineHtml = hasTimeline ? buildTimelineSection(currentMapData.timeline_summary) : '';

            content.innerHTML = `
                <div class="modal-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
                        <line x1="9" y1="3" x2="9" y2="18"/>
                        <line x1="15" y1="6" x2="15" y2="21"/>
                    </svg>
                </div>
                <h2 style="margin-bottom: 20px;">Open Map</h2>

                <div class="modal-map-info">
                    <div class="modal-map-title">${escapeHtml(currentMapData.title)}</div>
                    <div class="modal-map-author">
                        By ${escapeHtml(currentMapData.author)}${currentMapData.author_organization ? ' · ' + escapeHtml(currentMapData.author_organization) : ''}
                    </div>
                    ${currentMapData.description ? `<div class="modal-map-description">${escapeHtml(currentMapData.description)}</div>` : ''}
                </div>

                ${timelineHtml}

                <p style="color: var(--gray); margin-bottom: 20px; font-size: 14px;">
                    ${hasTimeline
                        ? 'This map includes a timeline showing evolution over time. Open in Deluxe to explore all snapshots.'
                        : 'Choose your preferred viewing mode to explore this map'
                    }
                </p>

                <div class="modal-buttons">
                    <button class="btn-express" onclick="openMapInExpress()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                        </svg>
                        Express
                    </button>
                    <button class="btn-deluxe" onclick="openMapInDeluxe()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;">
                            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                        </svg>
                        Deluxe${hasTimeline ? ' (Timeline)' : ''}
                    </button>
                    <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                </div>
            `;

            // Add large class if has timeline
            content.classList.toggle('large', hasTimeline);
            modal.classList.add('active');
        }

        function buildTimelineSection(timeline) {
            if (!timeline || timeline.length === 0) return '';

            const items = timeline.map(snap => {
                const year = snap.date ? new Date(snap.date).getFullYear() : '';
                return `
                    <div class="modal-timeline-item">
                        <span class="year">${year}</span>
                        <span class="label">${escapeHtml(snap.label)}</span>
                        <span class="date">${snap.date}</span>
                    </div>
                `;
            }).join('');

            return `
                <div class="modal-timeline-section">
                    <div class="modal-timeline-header">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                        Timeline: ${timeline.length} Snapshots
                    </div>
                    <div class="modal-timeline-list">
                        ${items}
                    </div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('viewModal').classList.remove('active');
            currentMapId = null;
            currentMapData = null;
        }

        function openMapInExpress() {
            if (currentMapId) {
                window.location.href = `express.html?map=${currentMapId}`;
            }
        }

        function openMapInDeluxe() {
            if (currentMapId) {
                window.location.href = `deluxe.html?map=${currentMapId}`;
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            const now = new Date();
            const diffDays = Math.floor((now - date) / (1000 * 60 * 60 * 24));

            if (diffDays === 0) return 'Today';
            if (diffDays === 1) return 'Yesterday';
            if (diffDays < 7) return `${diffDays} days ago`;
            if (diffDays < 30) return `${Math.floor(diffDays / 7)} weeks ago`;
            if (diffDays < 365) return `${Math.floor(diffDays / 30)} months ago`;
            return date.toLocaleDateString();
        }

        // Close modal on click outside
        document.getElementById('viewModal').addEventListener('click', (e) => {
            if (e.target.id === 'viewModal') {
                closeModal();
            }
        });

        // Escape key closes modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
