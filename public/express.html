<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-opMaps Express</title>
    <style>
        /* Reset and Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Verdana, sans-serif;
            font-size: 12px;
            background-color: #c0c0c0;
            color: #000000;
        }

        /* Classic Windows 95/2000 Style Elements */
        .window-border {
            border: 2px outset #ffffff;
            background-color: #c0c0c0;
        }

        .window-border-inset {
            border: 2px inset #ffffff;
            background-color: #ffffff;
        }

        /* Menu Bar */
        .menu-bar {
            background-color: #c0c0c0;
            border-bottom: 1px solid #808080;
            padding: 2px;
            display: flex;
            gap: 2px;
        }

        .menu-item {
            padding: 4px 8px;
            cursor: pointer;
        }

        .menu-item:hover {
            background-color: #000080;
            color: white;
        }

        /* Toolbar */
        .toolbar {
            background-color: #c0c0c0;
            border-bottom: 1px solid #808080;
            padding: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar-button {
            background-color: #c0c0c0;
            border: 2px outset #ffffff;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 11px;
            min-width: 28px;
            text-align: center;
        }

        .toolbar-button:active {
            border: 2px inset #ffffff;
        }

        .toolbar-separator {
            width: 1px;
            height: 24px;
            background-color: #808080;
            margin: 0 4px;
        }

        .toolbar-label {
            font-size: 11px;
            margin-right: 4px;
        }

        .toolbar-select {
            font-size: 11px;
            padding: 2px;
            border: 1px inset #ffffff;
        }

        /* Main Layout */
        .main-container {
            display: flex;
            height: calc(100vh - 54px);
        }

        /* Left Toolbar Panel */
        .tool-panel {
            width: 48px;
            background-color: #c0c0c0;
            border-right: 1px solid #808080;
            padding: 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tool-button {
            width: 36px;
            height: 36px;
            background-color: #c0c0c0;
            border: 2px outset #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .tool-button:active,
        .tool-button.active {
            border: 2px inset #ffffff;
            background-color: #a0a0a0;
        }

        /* Canvas Area */
        .canvas-area {
            flex: 1;
            background-color: #808080;
            overflow: auto;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        /* ============================================
           CANVAS STYLES - A4, A3, A2, A1
           All sizes have consistent border styling
           with centered, appropriately-sized titles
           ============================================ */

        .map-canvas {
            background-color: #ffffff;
            position: relative;
            box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4);
            /* Consistent border style for all sizes */
            border: 3px solid #000000;
            outline: 1px solid #404040;
            outline-offset: -6px;
        }

        /* Canvas Title - Always Centered */
        .canvas-title {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            color: #333333;
            background-color: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid #cccccc;
            z-index: 100;
        }

        /* A4 Canvas - 210mm x 297mm (Base reference) */
        .map-canvas.size-A4 {
            width: 595px;   /* 210mm at 72dpi */
            height: 842px;  /* 297mm at 72dpi */
        }

        .map-canvas.size-A4 .canvas-title {
            padding: 12px 20px;
            font-size: 18px;
        }

        /* A3 Canvas - 297mm x 420mm */
        .map-canvas.size-A3 {
            width: 842px;   /* 297mm at 72dpi */
            height: 1191px; /* 420mm at 72dpi */
        }

        .map-canvas.size-A3 .canvas-title {
            padding: 14px 24px;
            font-size: 20px;
        }

        /* A2 Canvas - 420mm x 594mm */
        .map-canvas.size-A2 {
            width: 1191px;  /* 420mm at 72dpi */
            height: 1684px; /* 594mm at 72dpi */
        }

        .map-canvas.size-A2 .canvas-title {
            padding: 16px 28px;
            font-size: 22px;
        }

        /* A1 Canvas - 594mm x 841mm */
        .map-canvas.size-A1 {
            width: 1684px;  /* 594mm at 72dpi */
            height: 2384px; /* 841mm at 72dpi */
        }

        .map-canvas.size-A1 .canvas-title {
            padding: 18px 32px;
            font-size: 24px;
        }

        /* Letter Canvas - 8.5" x 11" */
        .map-canvas.size-Letter {
            width: 612px;   /* 8.5" at 72dpi */
            height: 792px;  /* 11" at 72dpi */
        }

        .map-canvas.size-Letter .canvas-title {
            padding: 12px 20px;
            font-size: 18px;
        }

        /* Legal Canvas - 8.5" x 14" */
        .map-canvas.size-Legal {
            width: 612px;   /* 8.5" at 72dpi */
            height: 1008px; /* 14" at 72dpi */
        }

        .map-canvas.size-Legal .canvas-title {
            padding: 12px 20px;
            font-size: 18px;
        }

        /* Landscape Orientation Modifiers */
        .map-canvas.landscape.size-A4 {
            width: 842px;
            height: 595px;
        }

        .map-canvas.landscape.size-A3 {
            width: 1191px;
            height: 842px;
        }

        .map-canvas.landscape.size-A2 {
            width: 1684px;
            height: 1191px;
        }

        .map-canvas.landscape.size-A1 {
            width: 2384px;
            height: 1684px;
        }

        .map-canvas.landscape.size-Letter {
            width: 792px;
            height: 612px;
        }

        .map-canvas.landscape.size-Legal {
            width: 1008px;
            height: 612px;
        }

        /* Canvas Content Area (below title) */
        .canvas-content {
            position: absolute;
            top: 50px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            overflow: hidden;
        }

        .map-canvas.size-A3 .canvas-content,
        .map-canvas.size-A2 .canvas-content,
        .map-canvas.size-A1 .canvas-content {
            top: 60px;
        }

        /* Right Panel - Properties */
        .properties-panel {
            width: 220px;
            background-color: #c0c0c0;
            border-left: 1px solid #808080;
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            background-color: #000080;
            color: white;
            padding: 4px 8px;
            font-weight: bold;
            font-size: 12px;
        }

        .panel-content {
            padding: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 11px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            font-size: 11px;
            padding: 2px 4px;
            border: 1px inset #ffffff;
        }

        /* Status Bar */
        .status-bar {
            background-color: #c0c0c0;
            border-top: 1px solid #ffffff;
            padding: 4px 8px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
        }

        .status-section {
            border: 1px inset #ffffff;
            padding: 2px 8px;
            background-color: #c0c0c0;
        }

        /* Enterprise Nodes */
        .enterprise {
            position: absolute;
            border: 2px solid #000000;
            background-color: #ffffff;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 11px;
            padding: 4px;
            min-width: 80px;
            min-height: 50px;
        }

        .enterprise.cooperative {
            background-color: #90EE90;
            border-radius: 0;
        }

        .enterprise.for-profit {
            background-color: #87CEEB;
            border-radius: 0;
        }

        .enterprise.npo {
            background-color: #FFB6C1;
            border-radius: 50%;
        }

        .enterprise.government {
            background-color: #DDA0DD;
            border-style: double;
            border-width: 4px;
        }

        .enterprise.informal {
            background-color: #F0E68C;
            border-style: dashed;
        }

        .enterprise.generic-set {
            background-color: #D3D3D3;
            border-style: dotted;
        }

        .enterprise.selected {
            outline: 2px dashed #0000FF;
            outline-offset: 2px;
        }

        /* Relationship Lines */
        .relationship-line {
            position: absolute;
            pointer-events: none;
        }

        /* Symbol Key Panel */
        .symbol-key {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: #ffffff;
            border: 2px solid #000000;
            padding: 10px;
            min-width: 150px;
            font-size: 10px;
        }

        .symbol-key-title {
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
            border-bottom: 1px solid #000000;
            padding-bottom: 4px;
        }

        .symbol-key-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0;
        }

        .symbol-key-swatch {
            width: 20px;
            height: 14px;
            border: 1px solid #000000;
        }

        /* Modal Dialogs */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-window {
            background-color: #c0c0c0;
            border: 2px outset #ffffff;
            min-width: 300px;
            max-width: 500px;
        }

        .modal-titlebar {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 4px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background-color: #c0c0c0;
            border: 2px outset #ffffff;
            width: 18px;
            height: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
        }

        .modal-close:active {
            border: 2px inset #ffffff;
        }

        .modal-body {
            padding: 16px;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 16px;
        }

        .modal-button {
            background-color: #c0c0c0;
            border: 2px outset #ffffff;
            padding: 4px 20px;
            cursor: pointer;
            font-size: 12px;
        }

        .modal-button:active {
            border: 2px inset #ffffff;
        }

        /* Canvas Size Preview in Toolbar */
        .canvas-size-indicator {
            font-size: 11px;
            padding: 2px 6px;
            background-color: #ffffff;
            border: 1px inset #ffffff;
        }

        /* Zoom Controls */
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .zoom-level {
            width: 50px;
            text-align: center;
            background-color: #ffffff;
            border: 1px inset #ffffff;
            padding: 2px;
            font-size: 11px;
        }

        /* Version Badge */
        .version-badge {
            position: fixed;
            bottom: 30px;
            right: 10px;
            background-color: #4CAF50;
            color: white;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- Menu Bar -->
    <div class="menu-bar">
        <div class="menu-item">File</div>
        <div class="menu-item">Edit</div>
        <div class="menu-item">View</div>
        <div class="menu-item">Insert</div>
        <div class="menu-item">Format</div>
        <div class="menu-item">Tools</div>
        <div class="menu-item">Help</div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <button class="toolbar-button" title="New" onclick="newDiagram()">📄</button>
        <button class="toolbar-button" title="Open" onclick="openDiagram()">📂</button>
        <button class="toolbar-button" title="Save" onclick="saveDiagram()">💾</button>
        <div class="toolbar-separator"></div>
        <button class="toolbar-button" title="Undo">↶</button>
        <button class="toolbar-button" title="Redo">↷</button>
        <div class="toolbar-separator"></div>
        <span class="toolbar-label">Canvas:</span>
        <select id="canvas-size" class="toolbar-select" onchange="changeCanvasSize(this.value)">
            <option value="A4" selected>A4</option>
            <option value="A3">A3</option>
            <option value="A2">A2</option>
            <option value="A1">A1</option>
            <option value="Letter">Letter</option>
            <option value="Legal">Legal</option>
        </select>
        <select id="canvas-orientation" class="toolbar-select" onchange="changeOrientation(this.value)">
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
        </select>
        <div class="toolbar-separator"></div>
        <div class="zoom-controls">
            <button class="toolbar-button" onclick="zoomOut()">−</button>
            <span id="zoom-level" class="zoom-level">100%</span>
            <button class="toolbar-button" onclick="zoomIn()">+</button>
        </div>
        <div class="toolbar-separator"></div>
        <span class="canvas-size-indicator" id="size-indicator">A4: 210×297mm</span>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Tool Panel -->
        <div class="tool-panel">
            <button class="tool-button active" title="Select" onclick="setTool('select')">🖱️</button>
            <button class="tool-button" title="Add Enterprise" onclick="setTool('enterprise')">⬜</button>
            <button class="tool-button" title="Add Relationship" onclick="setTool('relationship')">↔️</button>
            <button class="tool-button" title="Add Text" onclick="setTool('text')">T</button>
            <button class="tool-button" title="Add Image" onclick="setTool('image')">🖼️</button>
            <button class="tool-button" title="Pan Canvas" onclick="setTool('pan')">✋</button>
        </div>

        <!-- Canvas Area -->
        <div class="canvas-area" id="canvas-area">
            <div id="map-canvas" class="map-canvas size-A4">
                <div class="canvas-title" id="canvas-title">Untitled Co-op Map</div>
                <div class="canvas-content" id="canvas-content">
                    <!-- Enterprises and relationships will be rendered here -->
                </div>

                <!-- Symbol Key -->
                <div class="symbol-key">
                    <div class="symbol-key-title">Symbol Key</div>
                    <div class="symbol-key-item">
                        <div class="symbol-key-swatch" style="background-color: #90EE90;"></div>
                        <span>Cooperative</span>
                    </div>
                    <div class="symbol-key-item">
                        <div class="symbol-key-swatch" style="background-color: #87CEEB;"></div>
                        <span>For-Profit</span>
                    </div>
                    <div class="symbol-key-item">
                        <div class="symbol-key-swatch" style="background-color: #FFB6C1; border-radius: 50%;"></div>
                        <span>Non-Profit</span>
                    </div>
                    <div class="symbol-key-item">
                        <div class="symbol-key-swatch" style="background-color: #DDA0DD; border-style: double; border-width: 3px;"></div>
                        <span>Government</span>
                    </div>
                    <div class="symbol-key-item">
                        <div class="symbol-key-swatch" style="background-color: #F0E68C; border-style: dashed;"></div>
                        <span>Informal</span>
                    </div>
                    <div class="symbol-key-item">
                        <div class="symbol-key-swatch" style="background-color: #D3D3D3; border-style: dotted;"></div>
                        <span>Generic Set</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Properties Panel -->
        <div class="properties-panel">
            <div class="panel-header">Properties</div>
            <div class="panel-content">
                <div class="form-group">
                    <label for="prop-title">Map Title:</label>
                    <input type="text" id="prop-title" value="Untitled Co-op Map" onchange="updateTitle(this.value)">
                </div>
                <div class="form-group">
                    <label for="prop-author">Author:</label>
                    <input type="text" id="prop-author" placeholder="Your name">
                </div>
                <hr style="margin: 12px 0; border: none; border-top: 1px solid #808080;">
                <div id="selection-properties" style="display: none;">
                    <div class="form-group">
                        <label for="ent-name">Enterprise Name:</label>
                        <input type="text" id="ent-name">
                    </div>
                    <div class="form-group">
                        <label for="ent-type">Type:</label>
                        <select id="ent-type">
                            <option value="cooperative">Cooperative</option>
                            <option value="for-profit">For-Profit</option>
                            <option value="npo">Non-Profit</option>
                            <option value="government">Government</option>
                            <option value="informal">Informal</option>
                            <option value="generic-set">Generic Set</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="ent-tier">Tier:</label>
                        <select id="ent-tier">
                            <option value="primary">Primary</option>
                            <option value="secondary">Secondary</option>
                            <option value="tertiary">Tertiary</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="ent-notes">Notes:</label>
                        <textarea id="ent-notes" rows="4"></textarea>
                    </div>
                </div>
                <div id="no-selection" style="color: #666; font-style: italic; font-size: 11px;">
                    Select an enterprise to view its properties.
                </div>
            </div>
        </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
        <span class="status-section" id="status-message">Ready</span>
        <div style="display: flex; gap: 8px;">
            <span class="status-section" id="status-objects">Objects: 0</span>
            <span class="status-section" id="status-collaborators">Collaborators: 1</span>
        </div>
    </div>

    <!-- Version Badge -->
    <div class="version-badge">EXPRESS</div>

    <!-- Canvas Size Modal -->
    <div id="canvas-modal" class="modal-overlay">
        <div class="modal-window">
            <div class="modal-titlebar">
                <span>Canvas Size</span>
                <button class="modal-close" onclick="closeModal('canvas-modal')">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Select canvas size:</label>
                    <select id="modal-canvas-size" style="width: 100%; padding: 4px;">
                        <option value="A4">A4 (210 × 297 mm)</option>
                        <option value="A3">A3 (297 × 420 mm)</option>
                        <option value="A2">A2 (420 × 594 mm)</option>
                        <option value="A1">A1 (594 × 841 mm)</option>
                        <option value="Letter">Letter (8.5 × 11 in)</option>
                        <option value="Legal">Legal (8.5 × 14 in)</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button class="modal-button" onclick="closeModal('canvas-modal')">Cancel</button>
                    <button class="modal-button" onclick="applyCanvasSize()">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Co-opMaps Express - Main Application Script (ES5 Compatible)

        // Application State
        var appState = {
            currentTool: 'select',
            canvasSize: 'A4',
            orientation: 'portrait',
            zoom: 100,
            enterprises: [],
            relationships: [],
            selectedEnterprise: null,
            diagramTitle: 'Untitled Co-op Map',
            isDirty: false
        };

        // Canvas size definitions (in pixels at 72dpi)
        var canvasSizes = {
            'A4': { width: 595, height: 842, label: 'A4: 210×297mm' },
            'A3': { width: 842, height: 1191, label: 'A3: 297×420mm' },
            'A2': { width: 1191, height: 1684, label: 'A2: 420×594mm' },
            'A1': { width: 1684, height: 2384, label: 'A1: 594×841mm' },
            'Letter': { width: 612, height: 792, label: 'Letter: 8.5×11in' },
            'Legal': { width: 612, height: 1008, label: 'Legal: 8.5×14in' }
        };

        // Initialize application
        function init() {
            // Load saved state from localStorage if available
            loadFromLocalStorage();
            updateSizeIndicator();
            updateStatus('Ready');
        }

        // Tool selection
        function setTool(tool) {
            appState.currentTool = tool;

            // Update tool button states
            var buttons = document.querySelectorAll('.tool-button');
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove('active');
            }
            event.target.classList.add('active');

            updateStatus('Tool: ' + tool.charAt(0).toUpperCase() + tool.slice(1));
        }

        // Canvas size change
        function changeCanvasSize(size) {
            var canvas = document.getElementById('map-canvas');

            // Remove all size classes
            canvas.classList.remove('size-A4', 'size-A3', 'size-A2', 'size-A1', 'size-Letter', 'size-Legal');

            // Add new size class
            canvas.classList.add('size-' + size);
            appState.canvasSize = size;

            updateSizeIndicator();
            appState.isDirty = true;
            updateStatus('Canvas size changed to ' + size);
        }

        // Orientation change
        function changeOrientation(orientation) {
            var canvas = document.getElementById('map-canvas');

            if (orientation === 'landscape') {
                canvas.classList.add('landscape');
            } else {
                canvas.classList.remove('landscape');
            }

            appState.orientation = orientation;
            appState.isDirty = true;
            updateStatus('Orientation changed to ' + orientation);
        }

        // Update size indicator
        function updateSizeIndicator() {
            var indicator = document.getElementById('size-indicator');
            var sizeInfo = canvasSizes[appState.canvasSize];
            indicator.textContent = sizeInfo.label;
        }

        // Update map title
        function updateTitle(title) {
            appState.diagramTitle = title;
            document.getElementById('canvas-title').textContent = title;
            document.title = title + ' - Co-opMaps Express';
            appState.isDirty = true;
        }

        // Zoom functions
        function zoomIn() {
            if (appState.zoom < 200) {
                appState.zoom += 10;
                applyZoom();
            }
        }

        function zoomOut() {
            if (appState.zoom > 25) {
                appState.zoom -= 10;
                applyZoom();
            }
        }

        function applyZoom() {
            var canvas = document.getElementById('map-canvas');
            canvas.style.transform = 'scale(' + (appState.zoom / 100) + ')';
            canvas.style.transformOrigin = 'top center';
            document.getElementById('zoom-level').textContent = appState.zoom + '%';
        }

        // Status updates
        function updateStatus(message) {
            document.getElementById('status-message').textContent = message;
        }

        // Modal functions
        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function applyCanvasSize() {
            var size = document.getElementById('modal-canvas-size').value;
            document.getElementById('canvas-size').value = size;
            changeCanvasSize(size);
            closeModal('canvas-modal');
        }

        // Diagram operations
        function newDiagram() {
            if (appState.isDirty) {
                if (!confirm('You have unsaved changes. Create new diagram anyway?')) {
                    return;
                }
            }

            appState.enterprises = [];
            appState.relationships = [];
            appState.diagramTitle = 'Untitled Co-op Map';
            appState.isDirty = false;

            document.getElementById('canvas-content').innerHTML = '';
            document.getElementById('prop-title').value = 'Untitled Co-op Map';
            document.getElementById('canvas-title').textContent = 'Untitled Co-op Map';

            updateStatus('New diagram created');
        }

        function saveDiagram() {
            var data = {
                version: '0.92',
                metadata: {
                    title: appState.diagramTitle,
                    canvasSize: appState.canvasSize,
                    orientation: appState.orientation,
                    created: new Date().toISOString(),
                    modified: new Date().toISOString()
                },
                enterprises: appState.enterprises,
                relationships: appState.relationships
            };

            try {
                localStorage.setItem('coopmaps_current', JSON.stringify(data));
                appState.isDirty = false;
                updateStatus('Diagram saved to local storage');
            } catch (e) {
                alert('Error saving diagram: ' + e.message);
            }
        }

        function openDiagram() {
            try {
                var data = localStorage.getItem('coopmaps_current');
                if (data) {
                    var diagram = JSON.parse(data);

                    appState.diagramTitle = diagram.metadata.title || 'Untitled Co-op Map';
                    appState.canvasSize = diagram.metadata.canvasSize || 'A4';
                    appState.orientation = diagram.metadata.orientation || 'portrait';
                    appState.enterprises = diagram.enterprises || [];
                    appState.relationships = diagram.relationships || [];

                    // Update UI
                    document.getElementById('prop-title').value = appState.diagramTitle;
                    document.getElementById('canvas-title').textContent = appState.diagramTitle;
                    document.getElementById('canvas-size').value = appState.canvasSize;
                    document.getElementById('canvas-orientation').value = appState.orientation;

                    changeCanvasSize(appState.canvasSize);
                    changeOrientation(appState.orientation);

                    appState.isDirty = false;
                    updateStatus('Diagram loaded');
                } else {
                    alert('No saved diagram found.');
                }
            } catch (e) {
                alert('Error loading diagram: ' + e.message);
            }
        }

        function loadFromLocalStorage() {
            try {
                var data = localStorage.getItem('coopmaps_current');
                if (data) {
                    var diagram = JSON.parse(data);
                    if (diagram.metadata) {
                        appState.canvasSize = diagram.metadata.canvasSize || 'A4';
                        document.getElementById('canvas-size').value = appState.canvasSize;
                        changeCanvasSize(appState.canvasSize);
                    }
                }
            } catch (e) {
                // Ignore errors on initial load
            }
        }

        // Switch to Deluxe version
        function switchToDeluxe() {
            if (appState.isDirty) {
                saveDiagram();
            }
            window.location.href = 'index.html';
        }

        // Initialize on load
        window.onload = init;

        // Warn before leaving with unsaved changes
        window.onbeforeunload = function() {
            if (appState.isDirty) {
                return 'You have unsaved changes.';
            }
        };
    </script>
</body>
</html>
