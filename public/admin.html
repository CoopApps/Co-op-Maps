<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Co-op Maps</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5a6fd6;
            --secondary: #764ba2;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --darker: #1a252f;
            --gray: #7f8c8d;
            --light-gray: #ecf0f1;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f6fa;
            color: var(--dark);
            min-height: 100vh;
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f5f6fa;
            animation: fadeIn 0.5s ease-out;
        }

        .login-box {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 90%;
            animation: slideUp 0.5s ease-out;
        }

        .login-logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .login-logo svg {
            width: 36px;
            height: 36px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        .login-box h2 {
            margin-bottom: 8px;
            color: var(--dark);
            text-align: center;
            font-size: 26px;
            font-weight: 700;
        }

        .login-box .subtitle {
            color: var(--gray);
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .login-box input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid var(--light-gray);
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 20px;
            transition: all 0.3s;
            background: white;
        }

        .login-box input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .login-box button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .error-message {
            background: rgba(231, 76, 60, 0.1);
            color: var(--danger);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }

        /* Dashboard */
        .dashboard {
            display: none;
            min-height: 100vh;
            animation: fadeIn 0.3s ease-out;
        }

        /* Header - matches deluxe */
        .header {
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: white;
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--danger) 0%, #c0392b 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }

        .header-logo svg {
            width: 22px;
            height: 22px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .header h1 span {
            opacity: 0.6;
            font-weight: 400;
            margin-left: 8px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-header {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-header:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-header.danger {
            background: rgba(231, 76, 60, 0.2);
            border-color: rgba(231, 76, 60, 0.3);
        }

        .btn-header.danger:hover {
            background: rgba(231, 76, 60, 0.3);
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            animation: slideUp 0.5s ease-out both;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-card .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .stat-card .stat-icon svg {
            width: 24px;
            height: 24px;
            stroke-width: 2;
            fill: none;
        }

        .stat-card.pending .stat-icon {
            background: rgba(243, 156, 18, 0.12);
        }
        .stat-card.pending .stat-icon svg { stroke: var(--warning); }

        .stat-card.approved .stat-icon {
            background: rgba(39, 174, 96, 0.12);
        }
        .stat-card.approved .stat-icon svg { stroke: var(--success); }

        .stat-card.rejected .stat-icon {
            background: rgba(231, 76, 60, 0.12);
        }
        .stat-card.rejected .stat-icon svg { stroke: var(--danger); }

        .stat-card.views .stat-icon {
            background: rgba(102, 126, 234, 0.12);
        }
        .stat-card.views .stat-icon svg { stroke: var(--primary); }

        .stat-content {
            flex: 1;
        }

        .stat-card h3 {
            font-size: 13px;
            color: var(--gray);
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: 700;
            color: var(--dark);
        }

        .stat-card.pending .value { color: var(--warning); }
        .stat-card.approved .value { color: var(--success); }
        .stat-card.rejected .value { color: var(--danger); }

        .stat-card:nth-child(1) { animation-delay: 0.1s; }
        .stat-card:nth-child(2) { animation-delay: 0.15s; }
        .stat-card:nth-child(3) { animation-delay: 0.2s; }
        .stat-card:nth-child(4) { animation-delay: 0.25s; }

        /* Tabs */
        .tabs-container {
            background: white;
            border-radius: 16px;
            padding: 6px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            display: inline-flex;
            gap: 4px;
            animation: slideUp 0.5s ease-out 0.3s both;
        }

        .tab {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: var(--gray);
            transition: all 0.3s;
        }

        .tab:hover:not(.active) {
            background: rgba(0, 0, 0, 0.05);
            color: var(--dark);
        }

        .tab.active {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        /* Search Bar */
        .search-container {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            animation: slideUp 0.5s ease-out 0.35s both;
        }

        .search-wrapper {
            display: flex;
            gap: 12px;
        }

        .search-input-container {
            flex: 1;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: var(--gray);
            stroke-width: 2;
            fill: none;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            border: 2px solid var(--light-gray);
            border-radius: 12px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .btn-search {
            padding: 14px 28px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-clear {
            padding: 14px 20px;
            background: var(--light-gray);
            color: var(--gray);
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-clear:hover {
            background: #dfe6e9;
            color: var(--dark);
        }

        /* Submissions List */
        .submissions-list {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            animation: slideUp 0.5s ease-out 0.4s both;
        }

        .submission-item {
            padding: 24px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .submission-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .submission-item:hover {
            background: rgba(102, 126, 234, 0.03);
        }

        .submission-item:hover::before {
            opacity: 1;
        }

        .submission-item:last-child {
            border-bottom: none;
        }

        .submission-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .submission-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
        }

        .submission-status {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: linear-gradient(135deg, rgba(243, 156, 18, 0.15) 0%, rgba(230, 126, 34, 0.15) 100%);
            color: #d68910;
        }

        .status-approved {
            background: linear-gradient(135deg, rgba(39, 174, 96, 0.15) 0%, rgba(33, 154, 82, 0.15) 100%);
            color: #1e8449;
        }

        .status-rejected {
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.15) 0%, rgba(192, 57, 43, 0.15) 100%);
            color: #c0392b;
        }

        .status-changes_requested {
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.15) 0%, rgba(142, 68, 173, 0.15) 100%);
            color: #8e44ad;
        }

        .submission-meta {
            font-size: 14px;
            color: var(--gray);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .submission-meta .dot {
            width: 4px;
            height: 4px;
            background: var(--gray);
            border-radius: 50%;
        }

        .submission-description {
            font-size: 14px;
            color: #95a5a6;
            line-height: 1.6;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--gray);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--light-gray);
            border-top-color: var(--primary);
            border-radius: 50%;
            margin: 0 auto 15px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--gray);
        }

        .empty-state-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 20px;
            opacity: 0.4;
        }

        .empty-state h3 {
            font-size: 20px;
            margin-bottom: 8px;
            color: var(--dark);
        }

        .empty-state p {
            font-size: 14px;
        }

        /* Review Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 9999;
            overflow-y: auto;
            padding: 40px 20px;
            animation: fadeIn 0.2s ease-out;
        }

        .modal.active { display: block; }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 1100px;
            margin: 0 auto;
            overflow: hidden;
            animation: slideUp 0.3s ease-out;
            box-shadow: 0 30px 100px rgba(0, 0, 0, 0.4);
        }

        .modal-header {
            padding: 24px 30px;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 22px;
            font-weight: 600;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            cursor: pointer;
            font-size: 20px;
            color: white;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal-body {
            display: grid;
            grid-template-columns: 1fr 380px;
        }

        .preview-area {
            padding: 30px;
            background: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-area img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }

        .details-area {
            padding: 30px;
            border-left: 1px solid var(--light-gray);
        }

        .detail-group {
            margin-bottom: 20px;
        }

        .detail-group label {
            display: block;
            font-size: 11px;
            color: var(--gray);
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-group .value {
            font-size: 15px;
            color: var(--dark);
            line-height: 1.5;
        }

        .tags-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            padding: 6px 12px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-radius: 20px;
            font-size: 12px;
            color: var(--primary);
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--light-gray);
        }

        .action-buttons button {
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-approve {
            background: linear-gradient(135deg, var(--success) 0%, #219a52 100%);
            color: white;
        }

        .btn-approve:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(39, 174, 96, 0.3);
        }

        .btn-changes {
            background: linear-gradient(135deg, var(--warning) 0%, #e67e22 100%);
            color: white;
        }

        .btn-changes:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(243, 156, 18, 0.3);
        }

        .btn-reject {
            background: linear-gradient(135deg, var(--danger) 0%, #c0392b 100%);
            color: white;
        }

        .btn-reject:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(231, 76, 60, 0.3);
        }

        .btn-cancel {
            background: var(--light-gray);
            color: var(--gray);
        }

        .btn-cancel:hover {
            background: #dfe6e9;
            color: var(--dark);
        }

        .btn-view {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        .btn-view:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        /* Password section */
        .password-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .password-display {
            font-family: monospace;
            background: var(--light-gray);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
        }

        .btn-small {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-small.show {
            background: var(--light-gray);
            color: var(--dark);
        }

        .btn-small.reset {
            background: rgba(231, 76, 60, 0.1);
            color: var(--danger);
        }

        .btn-small:hover {
            opacity: 0.8;
        }

        /* Badges for WDR, revision, hidden */
        .wdr-badge {
            display: inline-block;
            padding: 2px 8px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.15) 0%, rgba(118, 75, 162, 0.15) 100%);
            color: var(--primary);
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            font-family: Monaco, Consolas, monospace;
            margin-left: 8px;
        }

        .revision-badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(39, 174, 96, 0.15);
            color: var(--success);
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 6px;
        }

        .hidden-badge {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(127, 140, 141, 0.15);
            color: var(--gray);
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 6px;
        }

        .status-draft {
            background: linear-gradient(135deg, rgba(127, 140, 141, 0.15) 0%, rgba(149, 165, 166, 0.15) 100%);
            color: #7f8c8d;
        }

        /* Revisions list */
        .revisions-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--light-gray);
        }

        .revisions-section h4 {
            font-size: 12px;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .revision-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: var(--light-gray);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .revision-item.current {
            background: rgba(39, 174, 96, 0.1);
            border: 1px solid rgba(39, 174, 96, 0.3);
        }

        .revision-info {
            flex: 1;
        }

        .revision-info .rev-number {
            font-weight: 600;
            color: var(--dark);
        }

        .revision-info .rev-date {
            font-size: 12px;
            color: var(--gray);
        }

        .btn-toggle-hide {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            background: rgba(127, 140, 141, 0.2);
            color: var(--gray);
            transition: all 0.2s;
        }

        .btn-toggle-hide:hover {
            background: rgba(127, 140, 141, 0.3);
        }

        .btn-toggle-hide.hidden {
            background: rgba(231, 76, 60, 0.15);
            color: var(--danger);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .modal-body {
                grid-template-columns: 1fr;
            }

            .preview-area {
                border-bottom: 1px solid var(--light-gray);
                padding: 20px;
            }

            .preview-area img {
                max-height: 250px;
            }

            .details-area {
                border-left: none;
                padding: 20px;
            }

            .action-buttons {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .action-buttons button:last-child {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .search-wrapper {
                flex-direction: column;
            }

            .tabs-container {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(5, 1fr);
            }

            .tab {
                padding: 10px 8px;
                font-size: 11px;
            }

            .header h1 span {
                display: none;
            }

            .header-actions {
                gap: 6px;
            }

            .btn-header {
                padding: 6px 12px;
                font-size: 12px;
            }

            .container {
                padding: 20px 15px;
            }

            .stat-card {
                padding: 16px;
                gap: 12px;
            }

            .stat-card .stat-icon {
                width: 40px;
                height: 40px;
            }

            .stat-card .stat-icon svg {
                width: 20px;
                height: 20px;
            }

            .stat-card h3 {
                font-size: 11px;
            }

            .stat-card .value {
                font-size: 24px;
            }

            .submission-item {
                padding: 18px;
            }

            .submission-title {
                font-size: 16px;
            }

            .submission-status {
                padding: 4px 10px;
                font-size: 10px;
            }

            .submission-meta {
                font-size: 13px;
                flex-wrap: wrap;
            }

            /* Modal mobile fixes */
            .modal {
                padding: 20px 10px;
            }

            .modal-content {
                border-radius: 16px;
            }

            .modal-header {
                padding: 18px 20px;
            }

            .modal-header h2 {
                font-size: 18px;
            }

            .preview-area {
                padding: 15px;
            }

            .preview-area img {
                max-height: 200px;
            }

            .details-area {
                padding: 15px;
            }

            .detail-group {
                margin-bottom: 15px;
            }

            .detail-group .value {
                font-size: 14px;
            }

            .action-buttons {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .action-buttons button {
                padding: 12px 16px;
                font-size: 13px;
            }

            .password-section {
                flex-wrap: wrap;
                gap: 8px;
            }

            .password-display {
                font-size: 12px;
            }
        }

        /* Extra small screens */
        @media (max-width: 380px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .tabs-container {
                grid-template-columns: repeat(2, 1fr);
            }

            .tab {
                padding: 8px 10px;
                font-size: 11px;
            }

            .submission-header {
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-box">
            <div class="login-logo">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <h2>Admin Panel</h2>
            <p class="subtitle">Enter password to manage community maps</p>
            <div class="error-message" id="loginError">Invalid password. Please try again.</div>
            <form id="loginForm" onsubmit="AdminPanel.login(event)">
                <input type="password" id="adminPassword" placeholder="Admin Password" required autofocus>
                <button type="submit">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <div class="header-left">
                    <div class="header-logo">
                        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                    </div>
                    <h1>Admin Panel<span>Community Maps</span></h1>
                </div>
                <div class="header-actions">
                    <a href="index.html" class="btn-header">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        Home
                    </a>
                    <button class="btn-header danger" onclick="AdminPanel.logout()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                            <polyline points="16 17 21 12 16 7"/>
                            <line x1="21" y1="12" x2="9" y2="12"/>
                        </svg>
                        Logout
                    </button>
                </div>
            </div>
        </div>

        <!-- Container -->
        <div class="container">
            <!-- Stats Grid -->
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card pending">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    </div>
                    <div class="stat-content">
                        <h3>Pending Review</h3>
                        <div class="value" id="statPending">-</div>
                    </div>
                </div>
                <div class="stat-card approved">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                    </div>
                    <div class="stat-content">
                        <h3>Approved Maps</h3>
                        <div class="value" id="statApproved">-</div>
                    </div>
                </div>
                <div class="stat-card rejected">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
                    </div>
                    <div class="stat-content">
                        <h3>Rejected</h3>
                        <div class="value" id="statRejected">-</div>
                    </div>
                </div>
                <div class="stat-card views">
                    <div class="stat-icon">
                        <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </div>
                    <div class="stat-content">
                        <h3>Total Views</h3>
                        <div class="value" id="statViews">-</div>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs-container">
                <button class="tab active" onclick="AdminPanel.switchTab('pending', this)">Pending</button>
                <button class="tab" onclick="AdminPanel.switchTab('approved', this)">Approved</button>
                <button class="tab" onclick="AdminPanel.switchTab('rejected', this)">Rejected</button>
                <button class="tab" onclick="AdminPanel.switchTab('saved', this)">Saved Maps</button>
                <button class="tab" onclick="AdminPanel.switchTab('all', this)">All</button>
            </div>

            <!-- Search -->
            <div class="search-container">
                <div class="search-wrapper">
                    <div class="search-input-container">
                        <svg class="search-icon" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35"/>
                        </svg>
                        <input type="text" id="searchInput" class="search-input" placeholder="Search by title or author...">
                    </div>
                    <button class="btn-search" onclick="AdminPanel.loadSubmissions()">Search</button>
                    <button class="btn-clear" onclick="AdminPanel.clearFilters()">Clear</button>
                </div>
            </div>

            <!-- Submissions List -->
            <div class="submissions-list" id="submissionsList">
                <div class="loading">
                    <div class="loading-spinner"></div>
                    Loading submissions...
                </div>
            </div>
        </div>
    </div>

    <!-- Review Modal -->
    <div id="reviewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="reviewTitle">Review Submission</h2>
                <button class="close-btn" onclick="AdminPanel.closeReview()">×</button>
            </div>
            <div class="modal-body">
                <div class="preview-area">
                    <img id="reviewThumbnail" src="" alt="Map Preview">
                </div>
                <div class="details-area">
                    <div class="detail-group">
                        <label>Author</label>
                        <div class="value" id="reviewAuthor"></div>
                    </div>
                    <div class="detail-group">
                        <label>Email</label>
                        <div class="value" id="reviewEmail"></div>
                    </div>
                    <div class="detail-group">
                        <label>Organization</label>
                        <div class="value" id="reviewOrganization"></div>
                    </div>
                    <div class="detail-group">
                        <label>Description</label>
                        <div class="value" id="reviewDescription"></div>
                    </div>
                    <div class="detail-group">
                        <label>Tags</label>
                        <div class="tags-list" id="reviewTags"></div>
                    </div>
                    <div class="detail-group">
                        <label>Submitted</label>
                        <div class="value" id="reviewDate"></div>
                    </div>
                    <div class="detail-group">
                        <label>Status</label>
                        <div class="value" id="reviewStatus"></div>
                    </div>
                    <div class="detail-group">
                        <label>Password</label>
                        <div class="password-section">
                            <span class="password-display" id="passwordDisplay">••••••••</span>
                            <button class="btn-small show" onclick="AdminPanel.togglePasswordVisibility()" id="togglePasswordBtn">Show</button>
                            <button class="btn-small reset" onclick="AdminPanel.resetPassword()">Reset</button>
                        </div>
                    </div>

                    <div class="action-buttons" id="actionButtons">
                        <!-- Buttons populated dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="./config.js"></script>
    <script src="./js/api.js"></script>
    <script>
        const AdminPanel = {
            password: null,
            currentTab: 'pending',
            currentSubmission: null,
            SESSION_KEY: 'adminSession',
            SESSION_TIMEOUT: 5 * 60 * 1000, // 5 minutes in milliseconds

            // Initialize - check for existing session
            init() {
                const session = this.getSession();
                if (session) {
                    this.password = session.password;
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    this.loadDashboard();
                }
            },

            // Save session to sessionStorage with expiry
            saveSession(password) {
                const session = {
                    password: password,
                    expiry: Date.now() + this.SESSION_TIMEOUT
                };
                sessionStorage.setItem(this.SESSION_KEY, JSON.stringify(session));
            },

            // Get session if not expired
            getSession() {
                const sessionStr = sessionStorage.getItem(this.SESSION_KEY);
                if (!sessionStr) return null;

                try {
                    const session = JSON.parse(sessionStr);
                    if (Date.now() > session.expiry) {
                        sessionStorage.removeItem(this.SESSION_KEY);
                        return null;
                    }
                    // Refresh expiry on access
                    session.expiry = Date.now() + this.SESSION_TIMEOUT;
                    sessionStorage.setItem(this.SESSION_KEY, JSON.stringify(session));
                    return session;
                } catch {
                    sessionStorage.removeItem(this.SESSION_KEY);
                    return null;
                }
            },

            // Clear session
            clearSession() {
                sessionStorage.removeItem(this.SESSION_KEY);
            },

            async login(event) {
                event.preventDefault();
                const password = document.getElementById('adminPassword').value;

                try {
                    const response = await CoopMapsAPI.admin.getStats(password);
                    this.password = password;
                    this.saveSession(password);
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    this.loadDashboard();
                } catch (error) {
                    document.getElementById('loginError').style.display = 'block';
                    document.getElementById('adminPassword').value = '';
                }
            },

            logout() {
                this.password = null;
                this.clearSession();
                window.location.href = '/';
            },

            async loadDashboard() {
                try {
                    const response = await CoopMapsAPI.admin.getStats(this.password);
                    const stats = response.stats;

                    // Handle both old format (byStatus) and new format (pending_count, etc.)
                    if (stats.byStatus) {
                        document.getElementById('statPending').textContent = stats.byStatus.pending || 0;
                        document.getElementById('statApproved').textContent = stats.byStatus.approved || 0;
                        document.getElementById('statRejected').textContent = stats.byStatus.rejected || 0;
                        document.getElementById('statViews').textContent = (stats.totalViews || 0).toLocaleString();
                    } else {
                        document.getElementById('statPending').textContent = stats.pending_count || 0;
                        document.getElementById('statApproved').textContent = (parseInt(stats.approved_count || 0) + parseInt(stats.published_count || 0));
                        document.getElementById('statRejected').textContent = stats.rejected_count || 0;
                        document.getElementById('statViews').textContent = (stats.total_submissions || 0).toLocaleString();
                    }

                    this.loadSubmissions();
                } catch (error) {
                    console.error('Error loading dashboard:', error);
                    alert('Error loading dashboard: ' + error.message);
                }
            },

            switchTab(tab, btn) {
                this.currentTab = tab;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                this.loadSubmissions();
            },

            validStatuses: ['pending', 'approved', 'rejected', 'changes_requested', 'draft'],

            async loadSubmissions() {
                const list = document.getElementById('submissionsList');
                list.innerHTML = '<div class="loading"><div class="loading-spinner"></div>Loading submissions...</div>';

                try {
                    const search = document.getElementById('searchInput').value;

                    // Handle the "saved" tab differently - load all maps with passwords
                    if (this.currentTab === 'saved') {
                        await this.loadSavedMaps(list, search);
                        return;
                    }

                    const status = this.currentTab === 'all' ? undefined : this.currentTab;

                    const response = await CoopMapsAPI.admin.getSubmissions(this.password, {
                        status,
                        search: search || undefined,
                        sort: 'submitted_at',
                        order: 'desc',
                        limit: 50
                    });

                    list.innerHTML = '';

                    if (response.submissions.length === 0) {
                        list.innerHTML = `
                            <div class="empty-state">
                                <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                </svg>
                                <h3>No Submissions</h3>
                                <p>${search ? 'Try a different search term' : 'No maps in this category'}</p>
                            </div>
                        `;
                        return;
                    }

                    response.submissions.forEach(sub => {
                        const item = document.createElement('div');
                        item.className = 'submission-item';
                        item.addEventListener('click', () => this.showReview(sub.id));

                        const safeStatus = this.validStatuses.includes(sub.status) ? sub.status : 'pending';

                        // Show WDR badge for approved maps
                        const wdrBadge = sub.official_wdr ? `<span class="wdr-badge">${sub.official_wdr}</span>` : '';
                        // Show revision indicator
                        const revisionBadge = sub.revision_number > 1 ? `<span class="revision-badge">Rev ${sub.revision_number}</span>` : '';
                        // Show hidden indicator
                        const hiddenBadge = sub.hide_original ? `<span class="hidden-badge">Hidden</span>` : '';

                        item.innerHTML = `
                            <div class="submission-header">
                                <div class="submission-title">${this.escapeHtml(sub.title)} ${wdrBadge} ${revisionBadge} ${hiddenBadge}</div>
                                <span class="submission-status status-${safeStatus}">${sub.status.replace('_', ' ')}</span>
                            </div>
                            <div class="submission-meta">
                                <span>${this.escapeHtml(sub.author)}</span>
                                ${sub.organization ? `<span class="dot"></span><span>${this.escapeHtml(sub.organization)}</span>` : ''}
                                <span class="dot"></span>
                                <span>${this.formatDate(sub.created_at)}</span>
                            </div>
                            ${sub.description ? `<div class="submission-description">${this.escapeHtml(sub.description)}</div>` : ''}
                        `;

                        list.appendChild(item);
                    });
                } catch (error) {
                    console.error('Error loading submissions:', error);
                    list.innerHTML = `
                        <div class="empty-state">
                            <h3>Error Loading Submissions</h3>
                            <p>${error.message || 'Unknown error'}</p>
                        </div>
                    `;
                }
            },

            async loadSavedMaps(list, search) {
                try {
                    const response = await fetch(`${window.CONFIG?.API_URL || ''}/api/admin/all-maps?search=${encodeURIComponent(search || '')}`, {
                        headers: {
                            'X-Admin-Password': this.password
                        }
                    });

                    if (!response.ok) {
                        throw new Error('Failed to load saved maps');
                    }

                    const data = await response.json();
                    list.innerHTML = '';

                    if (data.maps.length === 0) {
                        list.innerHTML = `
                            <div class="empty-state">
                                <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                </svg>
                                <h3>No Saved Maps</h3>
                                <p>${search ? 'Try a different search term' : 'No maps have been saved yet'}</p>
                            </div>
                        `;
                        return;
                    }

                    data.maps.forEach(map => {
                        const item = document.createElement('div');
                        item.className = 'submission-item';
                        item.addEventListener('click', () => this.showSavedMapDetails(map));

                        const hasPassword = map.password_hash ? 'Yes' : 'No';
                        const statusBadge = map.status === 'draft' ? 'Draft (Not Submitted)' : map.status;

                        item.innerHTML = `
                            <div class="submission-header">
                                <div class="submission-title">${this.escapeHtml(map.title || 'Untitled Map')}</div>
                                <span class="submission-status status-${map.status || 'draft'}">${statusBadge}</span>
                            </div>
                            <div class="submission-meta">
                                <span>${this.escapeHtml(map.author || 'Anonymous')}</span>
                                <span class="dot"></span>
                                <span>Password: ${hasPassword}</span>
                                <span class="dot"></span>
                                <span>Created: ${this.formatDate(map.submitted_at)}</span>
                            </div>
                            <div class="submission-description" style="font-family: monospace; font-size: 12px; color: #888;">
                                ID: ${map.id}
                            </div>
                        `;

                        list.appendChild(item);
                    });
                } catch (error) {
                    console.error('Error loading saved maps:', error);
                    list.innerHTML = `
                        <div class="empty-state">
                            <h3>Error Loading Saved Maps</h3>
                            <p>${error.message || 'Unknown error'}</p>
                        </div>
                    `;
                }
            },

            showSavedMapDetails(map) {
                this.currentSubmission = map;

                document.getElementById('reviewTitle').textContent = map.title || 'Untitled Map';
                document.getElementById('reviewAuthor').textContent = map.author || 'Anonymous';
                document.getElementById('reviewEmail').textContent = map.email || 'N/A';
                document.getElementById('reviewOrganization').textContent = map.organization || 'N/A';
                document.getElementById('reviewDescription').textContent = map.description || 'No description';
                document.getElementById('reviewDate').textContent = this.formatDate(map.created_at);
                document.getElementById('reviewStatus').textContent = (map.status || 'DRAFT').toUpperCase();

                const tagsContainer = document.getElementById('reviewTags');
                tagsContainer.innerHTML = '<span style="color: #95a5a6;">No tags</span>';

                const thumbnail = document.getElementById('reviewThumbnail');
                if (map.thumbnail) {
                    thumbnail.src = map.thumbnail;
                } else {
                    thumbnail.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="400" height="300" fill="%23f0f0f0"/><text x="50%" y="50%" text-anchor="middle" fill="%237f8c8d" font-family="sans-serif" font-size="18">No Preview</text></svg>';
                }

                // Show password hash for saved maps
                const passwordDisplay = document.getElementById('passwordDisplay');
                if (map.password_hash) {
                    passwordDisplay.textContent = map.password_hash.substring(0, 20) + '...';
                    passwordDisplay.title = map.password_hash;
                } else {
                    passwordDisplay.textContent = 'No password set';
                }

                const actionsContainer = document.getElementById('actionButtons');
                actionsContainer.innerHTML = `
                    <button class="btn-view" onclick="AdminPanel.viewInEditor()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        View in Editor
                    </button>
                    <button class="btn-changes" onclick="AdminPanel.resetPassword()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        Reset Password
                    </button>
                    <button class="btn-reject" onclick="AdminPanel.deleteMap()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                        Delete Map
                    </button>
                    <button class="btn-cancel" onclick="AdminPanel.closeReview()">Close</button>
                `;

                document.getElementById('reviewModal').classList.add('active');
            },

            clearFilters() {
                document.getElementById('searchInput').value = '';
                this.loadSubmissions();
            },

            async showReview(submissionId) {
                try {
                    const response = await CoopMapsAPI.admin.getSubmission(this.password, submissionId);
                    const sub = response.submission;
                    this.currentSubmission = sub;

                    document.getElementById('reviewTitle').textContent = sub.title;
                    document.getElementById('reviewAuthor').textContent = sub.author;
                    document.getElementById('reviewEmail').textContent = sub.email;
                    document.getElementById('reviewOrganization').textContent = sub.organization || 'N/A';
                    document.getElementById('reviewDescription').textContent = sub.description || 'No description';
                    document.getElementById('reviewDate').textContent = this.formatDate(sub.created_at);
                    document.getElementById('reviewStatus').textContent = sub.status.toUpperCase().replace('_', ' ');

                    const tagsContainer = document.getElementById('reviewTags');
                    tagsContainer.innerHTML = '';
                    if (sub.tags && sub.tags.length > 0) {
                        sub.tags.forEach(tag => {
                            const tagSpan = document.createElement('span');
                            tagSpan.className = 'tag';
                            tagSpan.textContent = tag;
                            tagsContainer.appendChild(tagSpan);
                        });
                    } else {
                        tagsContainer.innerHTML = '<span style="color: #95a5a6;">No tags</span>';
                    }

                    const thumbnail = document.getElementById('reviewThumbnail');
                    if (sub.thumbnail) {
                        thumbnail.src = sub.thumbnail;
                    } else {
                        thumbnail.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300"><rect width="400" height="300" fill="%23f0f0f0"/><text x="50%" y="50%" text-anchor="middle" fill="%237f8c8d" font-family="sans-serif" font-size="18">No Preview Available</text></svg>';
                    }

                    const actionsContainer = document.getElementById('actionButtons');

                    // Check if this is a revision pending approval
                    const isRevision = sub.parent_map_id != null;

                    if (sub.status === 'pending') {
                        let buttons = `
                            <button class="btn-view" onclick="AdminPanel.viewInEditor()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                View in Editor
                            </button>
                            <button class="btn-approve" onclick="AdminPanel.approve()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
                                ${isRevision ? 'Approve Revision' : 'Approve & Publish'}
                            </button>`;

                        if (isRevision) {
                            buttons += `
                            <button class="btn-changes" onclick="AdminPanel.approveAndHide()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/><line x1="4" y1="4" x2="20" y2="20" stroke-opacity="0.5"/></svg>
                                Approve & Hide Original
                            </button>`;
                        }

                        buttons += `
                            <button class="btn-changes" onclick="AdminPanel.requestChanges()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                Request Changes
                            </button>
                            <button class="btn-reject" onclick="AdminPanel.reject()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                                Reject
                            </button>
                            <button class="btn-cancel" onclick="AdminPanel.closeReview()">Cancel</button>
                        `;
                        actionsContainer.innerHTML = buttons;
                    } else if (sub.status === 'approved') {
                        // Show WDR info and revision management for approved maps
                        let wdrInfo = sub.official_wdr ? `
                            <div class="detail-group" style="margin-bottom: 15px;">
                                <label>WDR Code</label>
                                <div class="value" style="font-family: Monaco, Consolas, monospace; font-size: 18px; color: var(--primary);">${sub.official_wdr}</div>
                            </div>
                        ` : '';

                        let hideToggle = sub.hide_original ?
                            `<button class="btn-toggle-hide hidden" onclick="AdminPanel.toggleHide(false)">Unhide Map</button>` :
                            `<button class="btn-toggle-hide" onclick="AdminPanel.toggleHide(true)">Hide Map</button>`;

                        actionsContainer.innerHTML = `
                            ${wdrInfo}
                            <button class="btn-view" onclick="AdminPanel.viewInEditor()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                View in Editor
                            </button>
                            <button class="btn-view" onclick="AdminPanel.viewRevisions()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                View Revisions
                            </button>
                            ${hideToggle}
                            <button class="btn-reject" onclick="AdminPanel.unpublish()">Unpublish</button>
                            <button class="btn-cancel" onclick="AdminPanel.closeReview()">Close</button>
                        `;
                    } else {
                        actionsContainer.innerHTML = `
                            <button class="btn-view" onclick="AdminPanel.viewInEditor()">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                View in Editor
                            </button>
                            <button class="btn-cancel" onclick="AdminPanel.closeReview()">Close</button>
                        `;
                    }

                    document.getElementById('reviewModal').classList.add('active');
                } catch (error) {
                    console.error('Error loading submission:', error);
                    alert('Error loading submission: ' + error.message);
                }
            },

            viewInEditor() {
                if (this.currentSubmission) {
                    window.open(`deluxe.html?map=${this.currentSubmission.id}`, '_blank');
                }
            },

            closeReview() {
                document.getElementById('reviewModal').classList.remove('active');
                this.currentSubmission = null;
                this.passwordVisible = false;
                document.getElementById('passwordDisplay').textContent = '••••••••';
                document.getElementById('togglePasswordBtn').textContent = 'Show';
            },

            async approve() {
                if (!this.currentSubmission) return;

                // Show approval dialog with WDR options
                this.showApprovalDialog();
            },

            showApprovalDialog() {
                const dialog = document.createElement('div');
                dialog.className = 'modal';
                dialog.id = 'approvalDialog';
                dialog.innerHTML = `
                    <div class="modal-content" style="max-width: 500px;">
                        <div class="modal-header" style="background: linear-gradient(135deg, #27ae60, #2ecc71);">
                            <h2>
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                                    <polyline points="22 4 12 14.01 9 11.01"/>
                                </svg>
                                Approve & Assign WDR
                            </h2>
                            <button class="close-btn" onclick="AdminPanel.closeApprovalDialog()">×</button>
                        </div>
                        <div style="padding: 25px;">
                            <p style="color: #666; margin-bottom: 20px;">
                                This map will be assigned an official World Directory Reference number.
                            </p>

                            <div class="form-group" style="margin-bottom: 20px;">
                                <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #333;">WDR Assignment</label>
                                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                                    <label style="flex: 1; display: flex; align-items: center; gap: 8px; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer;">
                                        <input type="radio" name="wdrType" value="auto" checked onchange="AdminPanel.toggleWdrInput()">
                                        <span>Auto-assign next WDR</span>
                                    </label>
                                    <label style="flex: 1; display: flex; align-items: center; gap: 8px; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer;">
                                        <input type="radio" name="wdrType" value="custom" onchange="AdminPanel.toggleWdrInput()">
                                        <span>Custom WDR</span>
                                    </label>
                                </div>
                                <input type="text" id="customWdrInput" placeholder="WDR-0000"
                                    style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-family: Monaco, Consolas, monospace; font-size: 16px; display: none;"
                                    pattern="WDR-[0-9]{4}" maxlength="8">
                                <small style="color: #999; font-size: 12px;" id="wdrHelp">Next available WDR will be assigned automatically</small>
                            </div>

                            <div class="form-group" style="margin-bottom: 20px;">
                                <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #333;">Admin Notes (optional)</label>
                                <textarea id="approvalNotes" rows="3"
                                    style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; resize: vertical;"
                                    placeholder="Internal notes about this approval..."></textarea>
                            </div>

                            <div class="form-group" style="margin-bottom: 20px;">
                                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                    <input type="checkbox" id="notifyAuthorCheck" checked>
                                    <span>Notify author by email</span>
                                </label>
                            </div>

                            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                                <button onclick="AdminPanel.closeApprovalDialog()"
                                    style="padding: 12px 24px; border: none; background: #e0e0e0; border-radius: 8px; cursor: pointer; font-weight: 600;">
                                    Cancel
                                </button>
                                <button onclick="AdminPanel.confirmApproval()"
                                    style="padding: 12px 24px; border: none; background: linear-gradient(135deg, #27ae60, #2ecc71); color: white; border-radius: 8px; cursor: pointer; font-weight: 600;">
                                    Approve & Publish
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.appendChild(dialog);
                setTimeout(() => dialog.classList.add('active'), 10);
            },

            toggleWdrInput() {
                const isCustom = document.querySelector('input[name="wdrType"]:checked').value === 'custom';
                const input = document.getElementById('customWdrInput');
                const help = document.getElementById('wdrHelp');
                input.style.display = isCustom ? 'block' : 'none';
                help.textContent = isCustom ? 'Format: WDR-0000 (4 digits)' : 'Next available WDR will be assigned automatically';
                if (isCustom) input.focus();
            },

            closeApprovalDialog() {
                const dialog = document.getElementById('approvalDialog');
                if (dialog) {
                    dialog.classList.remove('active');
                    setTimeout(() => dialog.remove(), 300);
                }
            },

            async confirmApproval() {
                if (!this.currentSubmission) return;

                const isCustom = document.querySelector('input[name="wdrType"]:checked').value === 'custom';
                const customWdr = isCustom ? document.getElementById('customWdrInput').value.trim() : null;
                const notes = document.getElementById('approvalNotes').value.trim() || null;
                const notifyAuthor = document.getElementById('notifyAuthorCheck').checked;

                // Validate custom WDR format
                if (isCustom && (!customWdr || !/^WDR-\d{4}$/.test(customWdr))) {
                    alert('Please enter a valid WDR in format WDR-0000');
                    return;
                }

                try {
                    const response = await CoopMapsAPI.admin.approveSubmission(
                        this.password,
                        this.currentSubmission.id,
                        notes,
                        notifyAuthor,
                        customWdr
                    );

                    this.closeApprovalDialog();
                    alert(`Map approved and published!\n\nAssigned WDR: ${response.officialWdr}`);
                    this.closeReview();
                    this.loadDashboard();
                } catch (error) {
                    alert('Error approving map: ' + error.message);
                }
            },

            async requestChanges() {
                if (!this.currentSubmission) return;
                const message = prompt('Message to creator (required):');
                if (!message) return;

                try {
                    await CoopMapsAPI.admin.requestChanges(this.password, this.currentSubmission.id, message, []);
                    alert('Change request sent to creator!');
                    this.closeReview();
                    this.loadDashboard();
                } catch (error) {
                    alert('Error sending change request: ' + error.message);
                }
            },

            async reject() {
                if (!this.currentSubmission) return;
                const reason = prompt('Rejection reason:');
                if (!reason) return;
                const message = prompt('Message to creator:');
                if (!message) return;

                try {
                    await CoopMapsAPI.admin.rejectSubmission(this.password, this.currentSubmission.id, reason, message, false);
                    alert('Map rejected!');
                    this.closeReview();
                    this.loadDashboard();
                } catch (error) {
                    alert('Error rejecting map: ' + error.message);
                }
            },

            async unpublish() {
                if (!this.currentSubmission) return;
                const reason = prompt('Reason for unpublishing:');
                if (!reason) return;

                try {
                    await CoopMapsAPI.admin.unpublishMap(this.password, this.currentSubmission.id, reason, true);
                    alert('Map unpublished!');
                    this.closeReview();
                    this.loadDashboard();
                } catch (error) {
                    alert('Error unpublishing map: ' + error.message);
                }
            },

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },

            formatDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            },

            passwordVisible: false,

            togglePasswordVisibility() {
                this.passwordVisible = !this.passwordVisible;
                const display = document.getElementById('passwordDisplay');
                const btn = document.getElementById('togglePasswordBtn');

                if (this.passwordVisible && this.currentSubmission) {
                    const hash = this.currentSubmission.password_hash || 'No password';
                    display.textContent = hash.substring(0, 20) + '...';
                    display.title = hash;
                    btn.textContent = 'Hide';
                } else {
                    display.textContent = '••••••••';
                    display.title = '';
                    btn.textContent = 'Show';
                }
            },

            async resetPassword() {
                if (!this.currentSubmission) return;
                const newPassword = prompt('Enter new password for this map:\n(Share this with the map creator)');
                if (!newPassword || newPassword.length < 4) {
                    if (newPassword !== null) {
                        alert('Password must be at least 4 characters');
                    }
                    return;
                }

                try {
                    await CoopMapsAPI.admin.resetMapPassword(this.password, this.currentSubmission.id, newPassword);
                    alert(`Password reset successfully!\n\nNew password: ${newPassword}\n\nPlease share this with the map creator.`);
                    this.showReview(this.currentSubmission.id);
                } catch (error) {
                    alert('Error resetting password: ' + error.message);
                }
            },

            async approveAndHide() {
                if (!this.currentSubmission) return;
                if (!confirm('Approve this revision and hide the original map?')) return;

                try {
                    const response = await fetch(`${window.CONFIG?.API_URL || ''}/api/admin/maps/${this.currentSubmission.id}/approve-revision`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Admin-Password': this.password
                        },
                        body: JSON.stringify({ hideOriginal: true })
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.error || 'Failed to approve revision');
                    }

                    const data = await response.json();
                    alert(`Revision approved!\nWDR: ${data.officialWdr}\nOriginal map has been hidden.`);
                    this.closeReview();
                    this.loadDashboard();
                } catch (error) {
                    alert('Error approving revision: ' + error.message);
                }
            },

            async toggleHide(hide) {
                if (!this.currentSubmission) return;

                try {
                    const response = await fetch(`${window.CONFIG?.API_URL || ''}/api/admin/maps/${this.currentSubmission.id}/toggle-hide`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Admin-Password': this.password
                        },
                        body: JSON.stringify({ hide })
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.error || 'Failed to toggle visibility');
                    }

                    alert(hide ? 'Map hidden from public view.' : 'Map is now visible to public.');
                    this.showReview(this.currentSubmission.id);
                } catch (error) {
                    alert('Error toggling visibility: ' + error.message);
                }
            },

            async viewRevisions() {
                if (!this.currentSubmission) return;

                try {
                    const response = await fetch(`${window.CONFIG?.API_URL || ''}/api/admin/maps/${this.currentSubmission.id}/revisions`, {
                        headers: {
                            'X-Admin-Password': this.password
                        }
                    });

                    if (!response.ok) {
                        throw new Error('Failed to load revisions');
                    }

                    const data = await response.json();

                    // Create revisions dialog
                    const dialog = document.createElement('div');
                    dialog.className = 'modal';
                    dialog.id = 'revisionsDialog';

                    let revisionsHtml = '';
                    if (data.revisions.length === 0) {
                        revisionsHtml = '<p style="color: #999; text-align: center; padding: 20px;">No revisions found</p>';
                    } else {
                        data.revisions.forEach(rev => {
                            const isCurrent = rev.is_current_revision;
                            const isHidden = rev.hide_original;
                            revisionsHtml += `
                                <div class="revision-item ${isCurrent ? 'current' : ''}">
                                    <div class="revision-info">
                                        <div class="rev-number">Revision ${rev.revision_number} ${isCurrent ? '(Current)' : ''} ${isHidden ? '(Hidden)' : ''}</div>
                                        <div class="rev-date">${this.formatDate(rev.submitted_at || rev.created_at)} - ${rev.status}</div>
                                    </div>
                                    <button class="btn-small show" onclick="AdminPanel.closeRevisionsDialog(); AdminPanel.showReview('${rev.id}')">View</button>
                                </div>
                            `;
                        });
                    }

                    dialog.innerHTML = `
                        <div class="modal-content" style="max-width: 500px;">
                            <div class="modal-header">
                                <h2>Revisions for ${this.currentSubmission.official_wdr || this.currentSubmission.title}</h2>
                                <button class="close-btn" onclick="AdminPanel.closeRevisionsDialog()">x</button>
                            </div>
                            <div style="padding: 20px;">
                                ${revisionsHtml}
                            </div>
                        </div>
                    `;

                    document.body.appendChild(dialog);
                    setTimeout(() => dialog.classList.add('active'), 10);
                } catch (error) {
                    alert('Error loading revisions: ' + error.message);
                }
            },

            closeRevisionsDialog() {
                const dialog = document.getElementById('revisionsDialog');
                if (dialog) {
                    dialog.classList.remove('active');
                    setTimeout(() => dialog.remove(), 300);
                }
            },

            async deleteMap() {
                if (!this.currentSubmission) return;

                const mapTitle = this.currentSubmission.title || 'this map';
                if (!confirm(`Are you sure you want to delete "${mapTitle}"?\n\nThis action cannot be undone.`)) {
                    return;
                }

                try {
                    const response = await fetch(`${window.CONFIG?.API_URL || ''}/api/admin/maps/${this.currentSubmission.id}`, {
                        method: 'DELETE',
                        headers: {
                            'X-Admin-Password': this.password
                        }
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.message || 'Failed to delete map');
                    }

                    alert('Map deleted successfully!');
                    this.closeReview();
                    this.loadSubmissions();
                } catch (error) {
                    alert('Error deleting map: ' + error.message);
                }
            }
        };

        // Handle Enter key in search
        document.getElementById('searchInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') AdminPanel.loadSubmissions();
        });

        // Close modal on backdrop click
        document.getElementById('reviewModal').addEventListener('click', (e) => {
            if (e.target.id === 'reviewModal') AdminPanel.closeReview();
        });

        // Escape key closes modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') AdminPanel.closeReview();
        });

        // Initialize admin panel (check for existing session)
        AdminPanel.init();
    </script>
</body>
</html>
